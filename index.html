<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>𝕾𝖈𝖗𝖊𝖊𝖓𝕾𝖍𝖊𝖑𝖋 🍥</title>
<meta name="theme-color" content="#121319">
<link rel="manifest" href="./manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root[data-theme="dark"]{
    --bg:#121319; --surface:#1a1c24; --surface-2:#21232d; --surface-3:#282b37;
    --text:#edeef3; --muted:#90939f; --border:rgba(255,255,255,.07); --border-strong:rgba(255,255,255,.14);
    --accent:#e3a23b; --accent-text:#1a1206; --danger:#e0616b; --shadow: 0 12px 32px rgba(0,0,0,.35);
    --scrim: rgba(8,9,12,.6);
  }
  :root[data-theme="light"]{
    --bg:#f5f3ee; --surface:#ffffff; --surface-2:#efece4; --surface-3:#e6e2d8;
    --text:#1c1c1a; --muted:#6d6a62; --border:rgba(20,18,10,.09); --border-strong:rgba(20,18,10,.16);
    --accent:#c47f1f; --accent-text:#fffaf0; --danger:#b6414c; --shadow: 0 12px 28px rgba(30,25,10,.12);
    --scrim: rgba(30,26,16,.4);
  }
  .status-watching{ --status-color:#e3a23b; }
  .status-planned{ --status-color:#5fa3a0; }
  .status-comeback{ --status-color:#9b8ce0; }
  .status-finished{ --status-color:#6fa679; }
  .status-dropped{ --status-color:#c97b84; }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  button, input{ font-family:inherit; color:inherit; }
  button{ cursor:pointer; }
  img{ display:block; max-width:100%; }
  ::selection{ background:var(--accent); color:var(--accent-text); }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:6px; }

  .app-shell{ min-height:100%; display:flex; flex-direction:column; }

  /* ---------- Topbar ---------- */
  .topbar{
    position:sticky; top:0; z-index:20; display:flex; align-items:center; justify-content:space-between;
    padding: max(14px, env(safe-area-inset-top)) 18px 14px; background:linear-gradient(var(--bg) 65%, transparent);
    backdrop-filter: blur(6px);
  }
  .brand{ display:flex; align-items:baseline; gap:8px; }
  .brand-mark{ font-size:20px; }
  .brand-name{ font-weight:800; font-size:17px; letter-spacing:.01em; }
  .brand-screen{ color:var(--text); }
  .brand-shelf{ color:var(--accent); }
  .brand-sub{ color:var(--muted); font-size:13px; }
  .topbar-actions{ display:flex; gap:6px; }
  .icon-btn{
    position:relative; width:40px; height:40px; border-radius:12px; border:1px solid var(--border);
    background:var(--surface); font-size:17px; display:flex; align-items:center; justify-content:center;
    transition: background .15s ease, transform .1s ease, border-color .15s ease;
  }
  .icon-btn:hover{ background:var(--surface-2); }
  .icon-btn:active{ transform: scale(.94); }
  .badge{
    position:absolute; top:-4px; right:-4px; min-width:17px; height:17px; padding:0 4px; border-radius:9px;
    background:var(--accent); color:var(--accent-text); font-size:10.5px; font-weight:700;
    display:flex; align-items:center; justify-content:center; line-height:1;
  }

  .main{ flex:1; padding: 4px 16px 96px; max-width:720px; width:100%; margin:0 auto; }
  @media (min-width: 860px){ .main{ max-width: 820px; padding-left:0; padding-right:0; } }

  .hero-glow{
    height:1px; margin: 2px 0 18px; background:
      radial-gradient(60% 100% at 20% 0%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 70%);
    height:64px; margin-top:-64px; pointer-events:none; position:relative; z-index:-1;
  }

  /* ---------- Status sections ---------- */
  .status-section{ border-top:1px solid var(--border); }
  .status-section:last-child{ border-bottom:1px solid var(--border); }
  .status-header{
    width:100%; display:flex; align-items:center; gap:10px; background:none; border:none;
    padding:15px 4px; text-align:left; font-size:15.5px; font-weight:700; color:var(--text);
  }
  .status-dot{ width:8px; height:8px; border-radius:50%; background:var(--status-color); flex:none; }
  .status-emoji{ font-size:16px; }
  .status-count{ margin-left:auto; color:var(--muted); font-weight:600; font-size:13.5px; }
  .status-caret{ color:var(--muted); font-size:12px; transition:transform .18s ease; margin-left:2px; }
  .status-header[aria-expanded="true"] .status-caret{ transform:rotate(90deg); }
  .status-list{ overflow:hidden; max-height:0; transition:max-height .25s ease; }
  .status-list.open{ max-height:4000px; }
  .status-list-inner{ padding-bottom:10px; }
  .status-empty{ color:var(--muted); font-size:13.5px; padding:14px 4px 20px; text-align:center; line-height:1.5; }

  .anime-row{
    width:100%; display:flex; align-items:center; gap:12px; background:none; border:none; border-top:1px solid var(--border);
    padding:9px 4px; text-align:left;
  }
  .status-list-inner .anime-row:first-child{ border-top:none; }
  .anime-row:hover{ background:var(--surface); border-radius:10px; }
  .poster-thumb{
    width:40px; height:56px; border-radius:6px; object-fit:cover; background:var(--surface-2); flex:none;
    border:1px solid var(--border);
  }
  .anime-title{ font-size:14.5px; font-weight:600; line-height:1.3; }

  /* ---------- Empty state ---------- */
  .empty-block{ padding:56px 10px; text-align:center; }
  .empty-emoji{ font-size:34px; margin-bottom:10px; }
  .empty-title{ font-weight:700; font-size:16px; margin-bottom:6px; }
  .empty-text{ color:var(--muted); font-size:14px; max-width:320px; margin:0 auto 18px; line-height:1.5; }

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px; border-radius:12px; border:1px solid transparent;
    padding:11px 18px; font-weight:700; font-size:14px; transition: filter .15s ease, transform .1s ease;
  }
  .btn:active{ transform:scale(.97); }
  .btn-accent{ background:var(--accent); color:var(--accent-text); }
  .btn-accent:hover{ filter:brightness(1.08); }
  .btn-ghost{ background:var(--surface); border-color:var(--border); color:var(--text); }
  .btn-ghost:hover{ background:var(--surface-2); }
  .btn-danger{ background:transparent; border-color:var(--danger); color:var(--danger); }
  .btn-danger:hover{ background:color-mix(in srgb, var(--danger) 12%, transparent); }
  .btn-block{ width:100%; }
  .btn-sm{ padding:8px 12px; font-size:13px; border-radius:10px; }

  /* ---------- View header (back nav) ---------- */
  .view-head{ display:flex; align-items:center; gap:10px; padding:10px 4px 6px; }
  .back-btn{
    background:var(--accent); border:1px solid var(--accent); color:var(--accent-text);
    font-size:14px; font-weight:700; display:flex; align-items:center; gap:6px;
    padding:8px 11px; border-radius:10px;
  }
  .back-btn:hover{ filter:brightness(1.08); }
  .view-title{ font-size:16px; font-weight:800; }
  .settings-view-head .view-title{ margin-left:auto; }

  /* ---------- Search ---------- */
  .search-box{ display:flex; gap:8px; padding:6px 4px 16px; position:sticky; top:66px; background:var(--bg); z-index:5; }
  .search-input{
    flex:1; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:11px 14px;
    font-size:14.5px; color:var(--text);
  }
  .search-input:focus{ border-color:var(--accent); }
  .search-hint{ color:var(--muted); font-size:13.5px; padding:8px 6px 20px; line-height:1.5; }
  .search-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(128px,1fr)); gap:14px; padding:4px; }
  .search-card{ background:none; border:none; text-align:left; padding:0; }
  .search-poster{ width:100%; aspect-ratio:2/3; border-radius:10px; object-fit:cover; background:var(--surface-2); border:1px solid var(--border); margin-bottom:7px; }
  .search-card-title{ font-size:13px; font-weight:600; line-height:1.3; }
  .search-card-owned{ font-size:11px; color:var(--accent); font-weight:700; margin-top:2px; }

  /* ---------- Detail ---------- */
  .detail-hero{ text-align:center; padding:6px 4px 18px; }
  .detail-title{ font-size:19px; font-weight:800; margin:0 0 16px; line-height:1.3; }
  .detail-poster-wrap{ position:relative; max-width:230px; margin:0 auto; }
  .detail-poster{ width:100%; aspect-ratio:2/3; border-radius:16px; object-fit:cover; background:var(--surface-2); border:1px solid var(--border); box-shadow:var(--shadow); }
  .detail-stats{
    display:inline-flex; gap:8px; align-items:center; margin-top:14px; background:var(--surface); border:1px solid var(--border);
    padding:7px 14px; border-radius:999px; font-size:12.5px; font-weight:700; color:var(--muted);
  }
  .detail-stats b{ color:var(--text); }
  .detail-tmdb-status{ margin-top:9px; font-size:12.5px; color:var(--muted); }
  .detail-actions{ padding:8px 4px 22px; display:flex; flex-direction:column; gap:10px; }
  .status-pill{
    display:inline-flex; align-items:center; gap:7px; font-size:12.5px; font-weight:700; padding:7px 13px 7px 10px;
    border-radius:999px; background:var(--surface); border:1px solid var(--border); align-self:center;
  }
  .status-pill .status-dot{ width:7px; height:7px; }
  .detail-meta-row{ display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap; }
  .rating-pill{
    display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:700; padding:7px 13px 7px 10px;
    border-radius:999px; background:var(--surface); border:1px solid var(--border); color:var(--muted);
  }
  .rating-pill:hover{ background:var(--surface-2); }
  .rating-pill .rating-emoji{ font-size:15px; color:var(--text); }

  .section-label{ font-size:12.5px; font-weight:700; color:var(--muted); padding:18px 4px 8px; }
  .season-row{ border-top:1px solid var(--border); }
  .season-head{ width:100%; display:flex; align-items:center; gap:10px; background:none; border:none; padding:13px 4px; text-align:left; }
  .season-name{ font-size:14.5px; font-weight:600; flex:1; }
  .season-check{
    width:22px; height:22px; border-radius:7px; border:1.5px solid var(--border-strong); flex:none;
    display:flex; align-items:center; justify-content:center; font-size:13px; background:var(--surface);
  }
  .season-check.checked{ background:var(--accent); border-color:var(--accent); color:var(--accent-text); }

  /* ---------- Settings ---------- */
  .field{ margin-bottom:18px; }
  .field-label{ font-size:13px; font-weight:700; margin-bottom:7px; display:block; }
  .field-help{ font-size:12px; color:var(--muted); margin-top:6px; line-height:1.5; }
  .field-input{ width:100%; background:var(--surface); border:1px solid var(--border); border-radius:11px; padding:11px 13px; font-size:14px; }
  .field-input:focus{ border-color:var(--accent); }
  .row{ display:flex; gap:10px; align-items:center; }
  .test-status{ font-size:12.5px; margin-top:9px; font-weight:600; }
  .test-status.ok{ color:#6fa679; }
  .test-status.err{ color:var(--danger); }
  .theme-row{ display:flex; gap:10px; }
  .theme-opt{ flex:1; padding:12px; border-radius:12px; border:1.5px solid var(--border); background:var(--surface); text-align:center; font-size:13px; font-weight:700; }
  .theme-opt.active{ border-color:var(--accent); color:var(--accent); }
  .swatches{ display:flex; gap:9px; flex-wrap:wrap; margin-top:2px; }
  .swatch{ width:30px; height:30px; border-radius:9px; border:2px solid transparent; }
  .swatch.active{ border-color:var(--text); }
  .divider{ height:1px; background:var(--border); margin:22px 0; }
  .import-export-row{ display:flex; gap:10px; }
  .import-export-row .btn{ flex:1; }

  /* ---------- Modal / overlay ---------- */
  .overlay{
    position:fixed; inset:0; background:var(--scrim); z-index:50; display:flex; align-items:flex-end; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity .18s ease;
  }
  .overlay.show{ opacity:1; pointer-events:auto; }
  @media (min-width:640px){ .overlay{ align-items:center; } }
  .sheet{
    width:100%; max-width:420px; background:var(--surface); border:1px solid var(--border); border-radius:20px 20px 0 0;
    padding: 8px 8px max(20px, env(safe-area-inset-bottom)); box-shadow:var(--shadow);
    transform:translateY(16px); transition:transform .18s ease;
  }
  .overlay.show .sheet{ transform:translateY(0); }
  @media (min-width:640px){ .sheet{ border-radius:20px; } }
  .sheet-grip{ width:36px; height:4px; border-radius:2px; background:var(--border-strong); margin:6px auto 12px; }
  .sheet-title{ font-size:15px; font-weight:800; padding:0 10px 14px; }
  .sheet-text{ font-size:13.5px; color:var(--muted); padding:0 10px 16px; line-height:1.5; }
  .status-choice{
    width:100%; display:flex; align-items:center; gap:11px; padding:13px 12px; border-radius:12px; border:none; background:none;
    text-align:left; font-size:14.5px; font-weight:600;
  }
  .status-choice:hover{ background:var(--surface-2); }
  .status-choice.current{ color:var(--accent); }
  .status-choice .status-dot{ width:9px; height:9px; }
  .rating-choice{
    width:100%; display:flex; align-items:center; gap:11px; padding:13px 12px; border-radius:12px; border:none; background:none;
    text-align:left; font-size:14.5px; font-weight:600;
  }
  .rating-choice:hover{ background:var(--surface-2); }
  .rating-choice.current{ background:var(--surface-2); color:var(--accent); }
  .rating-choice .rating-choice-emoji{ font-size:19px; }
  .sheet-actions{ display:flex; gap:10px; padding:6px 10px 4px; }
  .sheet-actions .btn{ flex:1; }

  /* ---------- Notifications ---------- */
  .notif-empty{ padding:44px 20px; text-align:center; color:var(--muted); font-size:13.5px; }
  .notif-item{ padding:13px 10px; border-top:1px solid var(--border); display:flex; gap:11px; }
  .notif-list .notif-item:first-child{ border-top:none; }
  .notif-item.unread{ background:color-mix(in srgb, var(--accent) 7%, transparent); border-radius:10px; }
  .notif-dot{ width:7px; height:7px; border-radius:50%; background:var(--accent); margin-top:6px; flex:none; }
  .notif-dot.read{ background:transparent; }
  .notif-body{ flex:1; }
  .notif-title{ font-size:13.5px; font-weight:700; line-height:1.4; }
  .notif-time{ font-size:11.5px; color:var(--muted); margin-top:3px; }
  .notif-delete{
    width:32px; height:32px; flex:none; align-self:center; border:1px solid var(--border);
    border-radius:9px; background:var(--surface); display:flex; align-items:center; justify-content:center;
    font-size:13px; padding:0; opacity:.72;
  }
  .notif-delete:hover{ background:var(--surface-2); opacity:1; }

  /* ---------- Loading / toast ---------- */
  .spinner{ font-size:30px; display:inline-block; animation:spin 1.1s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .loading-block{ padding:70px 0; text-align:center; color:var(--muted); }
  .loading-block .spinner{ margin-bottom:10px; }
  .inline-loading{ display:flex; align-items:center; gap:10px; color:var(--muted); font-size:13px; padding:14px 4px; }
  .inline-loading .spinner{ font-size:18px; }

  .toast-wrap{ position:fixed; left:0; right:0; bottom:18px; display:flex; justify-content:center; z-index:80; pointer-events:none; }
  .toast{
    background:var(--surface-3); border:1px solid var(--border-strong); color:var(--text); padding:11px 18px; border-radius:12px;
    font-size:13.5px; font-weight:600; box-shadow:var(--shadow); transform:translateY(8px); opacity:0; transition:all .2s ease;
    max-width:85vw;
  }
  .toast.show{ transform:translateY(0); opacity:1; }

  .pull-indicator{ display:flex; justify-content:center; align-items:center; height:0; overflow:hidden; transition:height .15s ease; color:var(--muted); }
  .pull-indicator.active{ height:44px; }

  .delete-fab{ display:flex; justify-content:center; padding:6px 4px 10px; }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.001s !important; transition-duration:.001s !important; }
  }
  .media-tabs{display:flex;margin:0 0 14px;border-bottom:1px solid var(--border);}
  .media-tab{flex:1;padding:11px 8px;background:transparent;border:0;border-bottom:2px solid transparent;color:var(--muted);font:inherit;font-weight:700;cursor:pointer;}
  .media-tab{font-size:15px;letter-spacing:.01em}.media-tab.active{color:var(--text);border-bottom-color:var(--accent);}
  .sort-row{ display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--muted); font-weight:600; padding:0 4px 10px; }
  .sort-row select{
    background:var(--surface); color:var(--text); border:1px solid var(--border); border-radius:8px;
    padding:4px 8px; font-size:12.5px; font-weight:600; font-family:inherit;
  }
  .status-returning{--status-color:#9b8ce0;}
  /* Subtle per-tab background treatment */
  .app-shell.series-mode{
    background:
      radial-gradient(1000px 520px at 10% 12%, color-mix(in srgb, var(--accent) 15%, transparent), transparent 68%),
      linear-gradient(145deg, color-mix(in srgb, var(--accent) 4%, var(--bg)), var(--bg) 62%);
  }
  .app-shell.anime-mode{
    background:
      radial-gradient(1000px 520px at 90% 12%, color-mix(in srgb, #9b8ce0 18%, transparent), transparent 68%),
      linear-gradient(215deg, color-mix(in srgb, #9b8ce0 5%, var(--bg)), var(--bg) 62%);
  }
  .app-shell.series-mode .main,
  .app-shell.anime-mode .main{ transition:background .2s ease; }

</style>

<style id="screenshelf-brand-1-5x">
.brand-name{font-size:25.5px;}
</style>

</head>

<style id="screenshelf-auth-style">
#screenshelf-auth-gate {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 99999;
  background: #0f0f10;
  color: #f5f5f5;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
#screenshelf-auth-gate .auth-box {
  width: 100%;
  max-width: 380px;
  text-align: center;
}
#screenshelf-auth-gate .auth-logo {
  font-size: 32px;
  font-weight: 700;
  margin-bottom: 10px;
}
#screenshelf-auth-gate .auth-sub {
  color: #9b9b9f;
  margin-bottom: 34px;
  font-size: 14px;
}
#screenshelf-auth-gate .auth-btn {
  width: 100%;
  padding: 15px;
  margin-top: 12px;
  border: 1px solid #303034;
  border-radius: 12px;
  background: #19191b;
  color: #fff;
  font-size: 15px;
  cursor: pointer;
}
#screenshelf-auth-gate .auth-btn.google {
  background: #fff;
  color: #111;
  border-color: #fff;
}
#screenshelf-auth-gate .auth-email-form {
  display: none;
  margin-top: 8px;
}
#screenshelf-auth-gate .auth-email-form input {
  width: 100%;
  padding: 14px;
  margin-top: 10px;
  border: 1px solid #303034;
  border-radius: 12px;
  background: #19191b;
  color: #fff;
  font-size: 15px;
  outline: none;
}
#screenshelf-auth-gate .auth-email-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 2px;
}
#screenshelf-auth-gate .auth-email-actions .auth-btn {
  margin-top: 10px;
}
#screenshelf-auth-gate .auth-back {
  background: transparent;
  border: 0;
  color: #9b9b9f;
  margin-top: 14px;
  cursor: pointer;
}
#screenshelf-auth-gate .auth-message {
  min-height: 20px;
  margin-top: 14px;
  color: #ff8f8f;
  font-size: 13px;
}
#screenshelf-auth-gate .auth-loading {
  display: none;
  color: #9b9b9f;
  font-size: 13px;
  margin-top: 14px;
}
</style>

<div id="screenshelf-auth-gate">
  <div class="auth-box">
    <div class="auth-logo">𝕾𝖈𝖗𝖊𝖊𝖓𝕾𝖍𝖊𝖑𝖋 🍥</div>
    <div class="auth-sub" id="auth-subtitle">Checking your session…</div>

    <div id="auth-choice">
      <button class="auth-btn google" id="auth-google">Continue with Google</button>
      <button class="auth-btn" id="auth-email">Continue with Email</button>
    </div>

    <form class="auth-email-form" id="auth-email-form">
      <input id="auth-email-input" type="email" autocomplete="email" placeholder="Email" required>
      <input id="auth-password-input" type="password" autocomplete="current-password" placeholder="Password" minlength="6" required>
      <div class="auth-email-actions">
        <button class="auth-btn" type="submit" id="auth-signin">Sign In</button>
        <button class="auth-btn" type="button" id="auth-create">Create Account</button>
      </div>
      <button class="auth-back" type="button" id="auth-back">← Back</button>
    </form>

};

const firebaseApp = initializeApp(firebaseConfig);
const firebaseAuth = getAuth(firebaseApp);

const firebaseDb = initializeFirestore(firebaseApp, {

(function setupFirebaseAuth(){
  const gate = document.getElementById('screenshelf-auth-gate');
  const choice = document.getElementById('auth-choice');
  const emailForm = document.getElementById('auth-email-form');
  const googleBtn = document.getElementById('auth-google');
  const emailBtn = document.getElementById('auth-email');
  const backBtn = document.getElementById('auth-back');
  const emailInput = document.getElementById('auth-email-input');
  const passwordInput = document.getElementById('auth-password-input');
  const createBtn = document.getElementById('auth-create');
  const loading = document.getElementById('auth-loading');
  const message = document.getElementById('auth-message');

  function setBusy(busy){
    googleBtn.disabled = busy;
    emailBtn.disabled = busy;
    backBtn.disabled = busy;
    createBtn.disabled = busy;
    document.getElementById('auth-signin').disabled = busy;
    loading.style.display = busy ? 'block' : 'none';
  }

  function showMessage(msg){
    message.textContent = msg || '';
  }

  function showEmailForm(){
    choice.style.display = 'none';
    emailForm.style.display = 'block';
    showMessage('');
    emailInput.focus();
  }

  function showChoices(){
    choice.style.display = 'block';
    emailForm.style.display = 'none';
    showMessage('');
  }

  function showAuthLoading(){
    gate.style.display = 'flex';
    choice.style.display = 'none';
    emailForm.style.display = 'none';
    loading.textContent = 'Checking your session…';
    loading.style.display = 'block';
    showMessage('');
  }

  function showLoginChoices(){
    gate.style.display = 'flex';
    choice.style.display = 'block';
    emailForm.style.display = 'none';
    loading.textContent = 'Signing in…';
    loading.style.display = 'none';
    showMessage('');
  }

  function friendlyAuthError(error){
    switch(error.code){
      case 'auth/invalid-credential': return 'Email or password is incorrect.';
      case 'auth/email-already-in-use': return 'An account already exists with this email.';
      case 'auth/weak-password': return 'Password must be at least 6 characters.';
      case 'auth/invalid-email': return 'Please enter a valid email address.';
      case 'auth/popup-closed-by-user': return 'Google sign-in was cancelled.';
      case 'auth/popup-blocked': return 'Your browser blocked the Google sign-in popup.';
      case 'auth/unauthorized-domain': return 'This website is not authorized for Firebase sign-in yet.';
      default: return error.message || 'Sign-in failed. Please try again.';
    }
  }

  googleBtn.addEventListener('click', async () => {
    showMessage('');
    setBusy(true);
    try {
      const provider = new GoogleAuthProvider();
      await signInWithPopup(firebaseAuth, provider);
    } catch(error) {
      console.error('Google sign-in failed:', error);
      showMessage(friendlyAuthError(error));
    } finally {
      setBusy(false);
    }
  });

  emailBtn.addEventListener('click', showEmailForm);
  backBtn.addEventListener('click', showChoices);

  emailForm.addEventListener('submit', async (event) => {
    event.preventDefault();
    showMessage('');
    setBusy(true);
    try {
      await signInWithEmailAndPassword(
        firebaseAuth,
        emailInput.value.trim(),
        passwordInput.value
      );
    } catch(error) {
      console.error('Email sign-in failed:', error);
      showMessage(friendlyAuthError(error));
    } finally {
      setBusy(false);
    }
  });

  createBtn.addEventListener('click', async () => {
    showMessage('');
    if (!emailForm.reportValidity()) return;
    setBusy(true);
    try {
      await createUserWithEmailAndPassword(
        firebaseAuth,
        emailInput.value.trim(),
        passwordInput.value
      );
    } catch(error) {
      console.error('Account creation failed:', error);
      showMessage(friendlyAuthError(error));
    } finally {
      setBusy(false);
    }
  });

  showAuthLoading();

  onAuthStateChanged(firebaseAuth, (user) => {
    if (user) {
      gate.style.display = 'none';
      try {
        window.ScreenShelfFirebase.startCloudSync(user);
      } catch(error) {
        console.error('Cloud sync failed to start:', error);
      }
    } else {
      try { window.ScreenShelfFirebase.stopCloudSync(); } catch(error) { console.error('Cloud sync teardown failed:', error); }
      showLoginChoices();
    }
  });
})();


(function(){
'use strict';

/* =========================================================
   Constants

const STATUSES = [
  { key:'watching', label:'Watching',      emoji:'⛩️' },
  { key:'planned',  label:'Planned',       emoji:'🍿' },
  { key:'comeback', label:'Coming back?',  emoji:'🤷' },

];
const STATUS_MAP = Object.fromEntries(STATUSES.map(s=>[s.key,s]));
const SHOW_STATUSES = [
  { key:'watching', label:'Watching', emoji:'🍿' },
  { key:'planned', label:'Planned', emoji:'📋' },
  { key:'returning', label:'Returning', emoji:'🔄' },
  { key:'finished', label:'Finished', emoji:'✅' },
  { key:'dropped', label:'Dropped', emoji:'🗑️' },

const RATINGS = [

  { key:'good', label:'Good', emoji:'😌' },
  { key:'okay', label:'Okay', emoji:'😐' },
  { key:'bad',  label:'Bad',  emoji:'☹️' },
];
const RATING_MAP = Object.fromEntries(RATINGS.map(r=>[r.key,r]));
const RATING_UNSET_EMOJI = '❓';
const TMDB_BASE = 'https://api.themoviedb.org/3';
const IMG_BASE = 'https://image.tmdb.org/t/p/';
const POSTER_SIZE = 'w342';
const ACCENTS = ['#e3a23b','#9b8ce0','#5fa3a0','#c97b84','#6fa679','#7f9fe0'];
const PLACEHOLDER_SVG = 'data:image/svg+xml;utf8,' + encodeURIComponent(

);

/* =========================================================
   App state

  activeTab: 'shows',

  expandedStatus: null,

function uid(){
  return (crypto && crypto.randomUUID) ? crypto.randomUUID() : 'id-' + Date.now() + '-' + Math.random().toString(16).slice(2);
}

/* =========================================================

   Library, settings, and notifications all live in Firestore.

   reads/writes and automatic sync on reconnect.

let cloudSyncUser = null;
let cloudUnsubProfile = null;
let cloudUnsubAnime = null;
let cloudUnsubSeries = null;
let cloudUnsubNotifications = null;
let hasTriggeredInitialRefresh = false;
let deletingLibraryIds = new Set();

function cloudCollectionName(mediaType){ return mediaType === 'show' ? 'series' : 'anime'; }
function cloudDocId(tmdbId){ return String(tmdbId); }

function localMillis(value){
  if (typeof value === 'number') return value;
  if (value && typeof value.toMillis === 'function') return value.toMillis();
  return value ? Date.parse(value) || Date.now() : Date.now();
}

function toCloudItem(item){
  const cleanSeasons = (item.seasons || []).map(s => ({
    seasonNumber: Number(s.seasonNumber),
    name: String(s.name || ''),
    episodeCount: Number(s.episodeCount || 0),
    watched: !!s.watched
  }));
  return {
    title: String(item.title || ''),
    poster: item.poster || null,
    backdrop: item.backdrop || null,
    status: String(item.status || ''),
    rating: (typeof item.rating === 'string' && RATING_MAP[item.rating]) ? item.rating : null,
    seasons: cleanSeasons,
    tmdbMeta: {
      numberOfSeasons: Number(item.tmdbMeta?.numberOfSeasons || 0),
      numberOfEpisodes: Number(item.tmdbMeta?.numberOfEpisodes || 0),
      tmdbStatus: String(item.tmdbMeta?.tmdbStatus || '')
    },
    addedAt: item.addedAt ? new Date(localMillis(item.addedAt)) : serverTimestamp(),
    updatedAt: serverTimestamp()
  };
}

function fromCloudItem(data, mediaType, tmdbId){
  return {
    id: String(tmdbId),
    tmdbId: Number(tmdbId),
    title: String(data.title || ''),
    poster: data.poster || null,
    backdrop: data.backdrop || null,
    status: String(data.status || ''),
    rating: (typeof data.rating === 'string' && RATING_MAP[data.rating]) ? data.rating : null,
    mediaType,
    seasons: Array.isArray(data.seasons) ? data.seasons.map(s => ({
      seasonNumber: Number(s.seasonNumber),
      name: String(s.name || ''),
      episodeCount: Number(s.episodeCount || 0),
      watched: !!s.watched
    })) : [],
    tmdbMeta: {
      numberOfSeasons: Number(data.tmdbMeta?.numberOfSeasons || 0),
      numberOfEpisodes: Number(data.tmdbMeta?.numberOfEpisodes || 0),
      tmdbStatus: String(data.tmdbMeta?.tmdbStatus || '')
    },
    addedAt: localMillis(data.addedAt),
    updatedAt: localMillis(data.updatedAt)
  };
}

async function cloudWriteItem(item){
  if (!cloudSyncUser) return;
  const ref = doc(firebaseDb, 'users', cloudSyncUser.uid,
    cloudCollectionName(item.mediaType), cloudDocId(item.tmdbId));
  await setDoc(ref, { ...toCloudItem(item), tmdbId: Number(item.tmdbId) }, { merge: true });
}

async function cloudDeleteItem(item){
  if (!cloudSyncUser) return;
  const ref = doc(firebaseDb, 'users', cloudSyncUser.uid,
    cloudCollectionName(item.mediaType), cloudDocId(item.tmdbId));
  await deleteDoc(ref);
}

function applyLibrarySnapshot(snapshot, collectionName){
  const isSeries = collectionName === 'series';
  const items = [];
  snapshot.forEach(d => {
    const data = d.data();
    const tmdbId = data.tmdbId || d.id;
    items.push(fromCloudItem(data, isSeries ? 'show' : 'anime', tmdbId));
  });
  if (isSeries) state.showLibrary = items; else state.library = items;
  render();
}

/* ---- Profile doc: TMDB key + theme + accent, one doc per user ---- */
async function cloudSaveProfile(fields){
  if (!cloudSyncUser) return;
  const ref = doc(firebaseDb, 'users', cloudSyncUser.uid);
  await setDoc(ref, { ...fields, updatedAt: serverTimestamp() }, { merge: true });
}

function applyProfileSnapshot(snap){
  if (snap.exists()){
    const data = snap.data();
    let changed = false;
    if (typeof data.tmdbApiKey === 'string' && data.tmdbApiKey !== state.settings.apiKey){ state.settings.apiKey = data.tmdbApiKey; changed = true; }
    if (typeof data.theme === 'string' && data.theme !== state.settings.theme){ state.settings.theme = data.theme; changed = true; }
    if (typeof data.accent === 'string' && data.accent !== state.settings.accent){ state.settings.accent = data.accent; changed = true; }
    if (changed){ applyTheme(); if (state.view === 'settings') render(); }
  }
  if (!hasTriggeredInitialRefresh && hasApiKey() && navigator.onLine){
    hasTriggeredInitialRefresh = true;
    refreshComebacks();
  }
}

/* ---- Notifications subcollection ---- */
function applyNotificationsSnapshot(snapshot){
  const items = [];
  snapshot.forEach(d => { const data = d.data(); items.push({ id: d.id, title: data.title, read: !!data.read, createdAt: localMillis(data.createdAt) }); });
  state.notifications = items.sort((a,b) => b.createdAt - a.createdAt);
  updateBellBadge();
  if (document.getElementById('overlay').classList.contains('show')) openNotifications();
}
async function cloudSaveNotification(n){
  if (!cloudSyncUser) return;
  const ref = doc(firebaseDb, 'users', cloudSyncUser.uid, 'notifications', n.id);
  await setDoc(ref, { title: n.title, read: !!n.read, createdAt: n.createdAt ? new Date(localMillis(n.createdAt)) : serverTimestamp() }, { merge: true });
}
async function cloudDeleteNotification(id){
  if (!cloudSyncUser) return;
  await deleteDoc(doc(firebaseDb, 'users', cloudSyncUser.uid, 'notifications', id));
}

function startCloudSync(user){
  cloudSyncUser = user;
  stopCloudSyncListeners();
  cloudUnsubProfile = onSnapshot(doc(firebaseDb, 'users', user.uid),
    snap => applyProfileSnapshot(snap), error => console.error('Profile sync failed:', error));
  cloudUnsubAnime = onSnapshot(collection(firebaseDb, 'users', user.uid, 'anime'),
    snap => applyLibrarySnapshot(snap, 'anime'), error => console.error('Anime sync failed:', error));
  cloudUnsubSeries = onSnapshot(collection(firebaseDb, 'users', user.uid, 'series'),
    snap => applyLibrarySnapshot(snap, 'series'), error => console.error('Series sync failed:', error));
  cloudUnsubNotifications = onSnapshot(collection(firebaseDb, 'users', user.uid, 'notifications'),
    snap => applyNotificationsSnapshot(snap), error => console.error('Notifications sync failed:', error));
}
function stopCloudSyncListeners(){
  if (cloudUnsubProfile) cloudUnsubProfile();
  if (cloudUnsubAnime) cloudUnsubAnime();
  if (cloudUnsubSeries) cloudUnsubSeries();
  if (cloudUnsubNotifications) cloudUnsubNotifications();
  cloudUnsubProfile = cloudUnsubAnime = cloudUnsubSeries = cloudUnsubNotifications = null;
}
function stopCloudSync(){
  stopCloudSyncListeners();
  cloudSyncUser = null;
  hasTriggeredInitialRefresh = false;
  state.library = [];
  state.showLibrary = [];
  state.notifications = [];
  state.settings.apiKey = '';
  state.settings.theme = 'dark';
  state.settings.accent = ACCENTS[0];
  state.view = 'home';
  state.previewMode = false;
  state.detailId = null;
}

window.ScreenShelfFirebase.stopCloudSync = stopCloudSync;

/* ---- Library item save/delete: optimistic local update + cloud write ---- */
async function saveAnime(a){ a.updatedAt = Date.now(); await cloudWriteItem(a); }
async function saveShow(a){ a.updatedAt = Date.now(); await cloudWriteItem(a); }
async function removeAnime(id){
  const item = [...state.library, ...state.showLibrary].find(x => x.id === id);
  if (!item) return;
  deletingLibraryIds.add(id);
  try{
    await cloudDeleteItem(item);
    state.library = state.library.filter(x => x.id !== id);
    state.showLibrary = state.showLibrary.filter(x => x.id !== id);
  }finally{
    deletingLibraryIds.delete(id);
  }
}
function activeLibrary(){ return state.activeTab === 'anime' ? state.library : state.showLibrary; }
function activeStatuses(){ return state.activeTab === 'anime' ? STATUSES : SHOW_STATUSES; }
function activeStatusMap(){ return state.activeTab === 'anime' ? STATUS_MAP : SHOW_STATUS_MAP; }
function saveActiveItem(a){ return state.activeTab === 'anime' ? saveAnime(a) : saveShow(a); }

/* =========================================================
   Theme

}

/* =========================================================
   TMDB API
========================================================= */
function hasApiKey(){ return !!(state.settings.apiKey && state.settings.apiKey.trim()); }

async function tmdbFetch(path, params){
  if (!hasApiKey()) { const e = new Error('No TMDB API key configured.'); e.code='NO_KEY'; throw e; }
  const url = new URL(TMDB_BASE + path);
  url.searchParams.set('api_key', state.settings.apiKey.trim());
  Object.entries(params || {}).forEach(([k,v]) => url.searchParams.set(k, v));
  let res;
  try { res = await fetch(url.toString()); }
  catch(err){ const e = new Error('Network error reaching TMDB.'); e.code='NETWORK'; throw e; }
  if (!res.ok) {
    let msg = 'TMDB request failed (' + res.status + ').';
    if (res.status === 401) msg = 'TMDB rejected the API key.';
    const e = new Error(msg); e.code = 'HTTP_' + res.status; throw e;
  }
  return res.json();
}
function searchTv(query){ return tmdbFetch('/search/tv', { query, include_adult:'false' }); }
function getTvDetails(tmdbId){ return tmdbFetch('/tv/' + tmdbId, {}); }
function testConnection(){ return tmdbFetch('/configuration', {}); }

function tmdbSeriesToAnimeShape(tv){
  const seasons = (tv.seasons || [])
    .filter(s => s.season_number !== 0)
    .sort((a,b)=> a.season_number - b.season_number)
    .map(s => ({
      tmdbSeasonId: s.id,
      seasonNumber: s.season_number,
      name: s.name || ('Season ' + s.season_number),
      episodeCount: s.episode_count || 0,
      watched: false,
    }));
  return {
    tmdbId: tv.id,
    title: tv.name,
    poster: tv.poster_path || null,
    backdrop: tv.backdrop_path || null,
    seasons,
    tmdbMeta: {
      numberOfSeasons: tv.number_of_seasons || seasons.length,
      numberOfEpisodes: tv.number_of_episodes || 0,
      tmdbStatus: tv.status || '',
    },
  };
}

function escapeHtml(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

const EMPTY_STATUS_MESSAGES = {
  watching: 'Nothing? I know you are studying😏',
  planned: 'You have nothing planned😳? What are you doing?',
  comeback: 'There are no returning shows🥱',
  returning: 'There are no returning shows🥱',
  finished: 'What? You haven\'t finished anything? Seriously?🫪',
  dropped: 'Oh, nothing dropped. You picked good shows then🙂',
};
const SORT_OPTIONS = [
  { key:'az', label:'A–Z' },
  { key:'added', label:'Recently Added' },
  { key:'updated', label:'Recently Updated' },
];
function activeSortKey(){ return state.activeTab==='anime' ? state.sortBy.anime : state.sortBy.shows; }
function sortItems(items){
  const mode = activeSortKey();
  const sorted = items.slice();
  if (mode === 'added') sorted.sort((x,y)=> (y.addedAt||0) - (x.addedAt||0));
  else if (mode === 'updated') sorted.sort((x,y)=> (y.updatedAt||0) - (x.updatedAt||0));
  else sorted.sort((x,y)=> x.title.localeCompare(y.title));
  return sorted;
}
function renderHome(){
  const lib=activeLibrary(), statuses=activeStatuses();
  const tabs=`<div class="media-tabs" role="tablist">
    <button class="media-tab ${state.activeTab==='shows'?'active':''}" data-media-tab="shows">𝕊𝕖𝕣𝕚𝕖𝕤</button>
    <button class="media-tab ${state.activeTab==='anime'?'active':''}" data-media-tab="anime">𝔸𝕟𝕚𝕞𝕖</button>
  </div>`;
  if(!lib.length)return tabs+`<div class="empty-block"><div class="empty-emoji">${state.activeTab==='anime'?'🍥':'📺'}</div>
    <div class="empty-title">Your ${state.activeTab==='anime'?'anime':'show'} library is empty</div>
    <div class="empty-text">Search TMDB to find a series and add it to one of your lists.</div>
    <button class="btn btn-accent" id="empty-search-btn">🔍 Search TMDB</button></div>`;
  const sortRow = `<div class="sort-row">Sort:
    <select id="sort-select" aria-label="Sort library">${SORT_OPTIONS.map(o=>`<option value="${o.key}" ${activeSortKey()===o.key?'selected':''}>${o.label}</option>`).join('')}</select>

  if (n > 0){ badge.hidden = false; badge.textContent = n > 99 ? '99+' : String(n); }
  else badge.hidden = true;

function timeAgo(ts){
  const diff = Date.now() - ts;
  const mins = Math.round(diff/60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return mins + 'm ago';
  const hrs = Math.round(mins/60);
  if (hrs < 24) return hrs + 'h ago';
  const days = Math.round(hrs/24);
  return days + 'd ago';
}

/* =========================================================
   Import / Export
========================================================= */
function exportLibrary(){
  const serializeItem = (a) => ({
    tmdbId: a.tmdbId,
    title: a.title,
    poster: a.poster || null,
    backdrop: a.backdrop || null,
    status: a.status,
    rating: (typeof a.rating === 'string' && RATING_MAP[a.rating]) ? a.rating : null,
    addedAt: a.addedAt || null,
    mediaType: a.mediaType || null,
    seasons: (a.seasons || []).map(s => ({
      tmdbSeasonId: s.tmdbSeasonId,
      seasonNumber: s.seasonNumber,
      name: s.name,
      episodeCount: s.episodeCount,
      watched: !!s.watched,
    })),
    tmdbMeta: a.tmdbMeta || null,
  });

  const payload = {
    app: 'screenshelf',
    version: 2,
    exportedAt: new Date().toISOString(),
    libraries: {
      anime: state.library.map(serializeItem),
      series: state.showLibrary.map(serializeItem),
    },
  };

  const blob = new Blob([JSON.stringify(payload, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = 'screenshelf-backup-' + new Date().toISOString().slice(0,10) + '.json';
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  showToast('Backup downloaded.');
}

async function importLibrary(file){
  let data;
  try {
    data = JSON.parse(await file.text());
  } catch(e) {
    showToast('That file is not valid JSON.');
    return;
  }

  // Supports the new combined backup and the previous anime-only backup.
  const animeIncoming = Array.isArray(data?.libraries?.anime)
    ? data.libraries.anime
    : Array.isArray(data?.library)
      ? data.library
      : Array.isArray(data)
        ? data
        : [];

  const seriesIncoming = Array.isArray(data?.libraries?.series)
    ? data.libraries.series
    : [];

  if (!animeIncoming.length && !seriesIncoming.length) {
    showToast("That file doesn't look like a ScreenShelf backup.");
    return;
  }

  let animeAdded = 0, seriesAdded = 0, skipped = 0;

  const restore = async (item, mediaType) => {
    if (!item?.tmdbId || !item?.title) {
      skipped++;
      return;
    }

    const target = mediaType === 'show' ? state.showLibrary : state.library;
    if (target.some(a => a.tmdbId === item.tmdbId)) {
      skipped++;
      return;
    }

    const restored = {
      id: String(item.tmdbId),
      tmdbId: item.tmdbId,
      title: item.title,
      poster: item.poster || null,
      backdrop: item.backdrop || null,
      status: item.status || 'planned',
      rating: (typeof item.rating === 'string' && RATING_MAP[item.rating]) ? item.rating : null,
      mediaType,
      seasons: Array.isArray(item.seasons)
        ? item.seasons.map(s => Object.assign({}, s))
        : [],
      tmdbMeta: item.tmdbMeta || null,
      addedAt: item.addedAt || Date.now(),
    };

    target.push(restored);
    await saveActiveItemForType(restored, mediaType);

    if (mediaType === 'show') seriesAdded++;
    else animeAdded++;
  };

  for (const item of animeIncoming) await restore(item, 'anime');
  for (const item of seriesIncoming) await restore(item, 'show');

  showToast(
    `Imported ${animeAdded} anime + ${seriesAdded} series` +
    (skipped ? `, skipped ${skipped} (already had / invalid)` : '') + '.'
  );
  render();
}

/* =========================================================
   Refresh / "Coming back?" update check
========================================================= */
async function refreshComebacks(){
  if(!hasApiKey()||state.refreshing)return;
  state.refreshing=true;
  try{
    for(const a of [...state.library,...state.showLibrary]){
      try{
        // Do not process an item whose deletion is currently in flight.
        if(deletingLibraryIds.has(a.id)) continue;

        const tv=await getTvDetails(a.tmdbId);

        // The item may have been deleted while the TMDB request was pending.
        const currentLibrary = a.mediaType === 'show' ? state.showLibrary : state.library;
        const currentItem = currentLibrary.find(x=>x.id===a.id);
        if(!currentItem || deletingLibraryIds.has(a.id)) continue;

        const prev=currentItem.tmdbMeta||{numberOfSeasons:0,numberOfEpisodes:0,tmdbStatus:''};
        const ns=tv.number_of_seasons||0,ne=tv.number_of_episodes||0,st=tv.status||'';
        const newContent=ns>prev.numberOfSeasons||ne>prev.numberOfEpisodes;
        const returned=prev.tmdbStatus&&/ended|canceled|cancelled/i.test(prev.tmdbStatus)&&st&&/returning/i.test(st);

        if(newContent||returned){
          const note={id:uid(),animeId:currentItem.id,mediaType:currentItem.mediaType||'anime',title:returned ? currentItem.title + ' is returning!' : currentItem.title + ' — ' + (
            (ns - prev.numberOfSeasons) > 0
              ? `New season (${ns} total)`
              : `${ne - prev.numberOfEpisodes} new episode${(ne - prev.numberOfEpisodes) === 1 ? '' : 's'}`
          ),createdAt:Date.now(),read:false};
          state.notifications.unshift(note);
          await saveNotification(note);

          // Notification saving is asynchronous, so check again before
          // changing/saving the library item.
          const liveLibrary = currentItem.mediaType === 'show' ? state.showLibrary : state.library;
          if(!liveLibrary.some(x=>x.id===currentItem.id) || deletingLibraryIds.has(currentItem.id)) continue;

          const fresh=tmdbSeriesToAnimeShape(tv),watched=new Map((currentItem.seasons||[]).map(x=>[x.seasonNumber,!!x.watched]));
          currentItem.seasons=fresh.seasons.map(x=>Object.assign(x,{watched:watched.get(x.seasonNumber)||false}));
        }

        const metaChanged = ns!==prev.numberOfSeasons || ne!==prev.numberOfEpisodes || st!==prev.tmdbStatus;
        if(metaChanged){
          // No await occurs between this final guard and the Firestore write.
          // If deletion starts later, its deleteDoc is queued after this write.
          const liveLibrary = currentItem.mediaType === 'show' ? state.showLibrary : state.library;
          const stillExists=liveLibrary.some(x=>x.id===currentItem.id);
          if(!stillExists || deletingLibraryIds.has(currentItem.id)) continue;

          currentItem.tmdbMeta={numberOfSeasons:ns,numberOfEpisodes:ne,tmdbStatus:st};
          await saveActiveItemForType(currentItem,currentItem.mediaType==='show'?'show':'anime');
        }
      }catch(e){ console.warn('refreshComebacks failed for', a.title, e); }
    }
  }finally{
    state.refreshing=false;
    render();
  }
}

/* =========================================================
   Pull to refresh (touch)
========================================================= */
function setupPullToRefresh(){
  const main = document.getElementById('main');
  let startY = null, pulling = false;
  main.addEventListener('touchstart', (e) => {
    if (state.view !== 'home' || window.scrollY > 4) { startY = null; return; }
    startY = e.touches[0].clientY;
  }, { passive:true });
  main.addEventListener('touchmove', (e) => {
    if (startY == null) return;
    const dy = e.touches[0].clientY - startY;
    if (dy > 60 && !pulling){ pulling = true; }
  }, { passive:true });
  main.addEventListener('touchend', async () => {
    if (pulling){
      pulling = false; startY = null;
      showToast('Checking for updates…');
      await refreshComebacks();
      showToast('Up to date.');
    }
    startY = null;
  });
}

/* =========================================================
   Event wiring
========================================================= */
function wireViewEvents(){
  const main = document.getElementById('main');
  main.querySelectorAll('[data-media-tab]').forEach(el=>el.addEventListener('click',()=>{
    state.activeTab=el.getAttribute('data-media-tab');state.expandedStatus=null;
    state.view='home';state.previewMode=false;state.searchQuery='';state.searchResults=[];render();
  }));
  const sortSelect = document.getElementById('sort-select');
  if (sortSelect) sortSelect.addEventListener('change', () => {
    const key = state.activeTab==='anime' ? 'anime' : 'shows';
    state.sortBy[key] = sortSelect.value;
    render();
  });

  main.querySelectorAll('[data-go]').forEach(el => el.addEventListener('click', () => {
    const to = el.getAttribute('data-go');
    if (to === 'home') goHome(); else if (to === 'search') goSearch(); else if (to === 'settings') goSettings();
  }));
  const emptySearchBtn = document.getElementById('empty-search-btn');
  if (emptySearchBtn) emptySearchBtn.addEventListener('click', goSearch);

  main.querySelectorAll('[data-toggle-status]').forEach(el => el.addEventListener('click', () => {
    const key = el.getAttribute('data-toggle-status');
    state.expandedStatus = state.expandedStatus === key ? null : key;
    render();
  }));
  main.querySelectorAll('[data-open-detail]').forEach(el => el.addEventListener('click', () => {
    openDetail(el.getAttribute('data-open-detail'));
  }));

  const searchInput = document.getElementById('search-input');
  if (searchInput) searchInput.addEventListener('input', (e) => onSearchInput(e.target.value));
  main.querySelectorAll('[data-preview]').forEach(el => el.addEventListener('click', () => {
    openPreview(Number(el.getAttribute('data-preview')));
  }));

  main.querySelectorAll('[data-toggle-watched]').forEach(el => el.addEventListener('click', () => {
    toggleSeasonWatched(Number(el.getAttribute('data-toggle-watched')));
  }));
  const addBtn = document.getElementById('add-anime-btn') || main.querySelector('[data-add-anime]');
  if (addBtn) addBtn.addEventListener('click', addPreviewToLibrary);
  const changeStatusBtn = main.querySelector('[data-change-status]');
  if (changeStatusBtn) changeStatusBtn.addEventListener('click', openStatusSheet);
  const openRatingBtn = main.querySelector('[data-open-rating]');
  if (openRatingBtn) openRatingBtn.addEventListener('click', openRatingSheet);
  const deleteBtn = main.querySelector('[data-delete-anime]');
  if (deleteBtn) deleteBtn.addEventListener('click', openDeleteSheet);

  // Settings
  const saveKeyBtn = document.getElementById('save-key-btn');
  if (saveKeyBtn) saveKeyBtn.addEventListener('click', saveApiKey);
  const testBtn = document.getElementById('test-conn-btn');
  if (testBtn) testBtn.addEventListener('click', runTestConnection);
  main.querySelectorAll('[data-theme-choice]').forEach(el => el.addEventListener('click', () => setTheme(el.getAttribute('data-theme-choice'))));
  main.querySelectorAll('[data-accent]').forEach(el => el.addEventListener('click', () => setAccent(el.getAttribute('data-accent'))));
  const exportBtn = document.getElementById('export-btn');
  if (exportBtn) exportBtn.addEventListener('click', exportLibrary);
  const importBtn = document.getElementById('import-btn');
  const importFile = document.getElementById('import-file');
  if (importBtn && importFile){
    importBtn.addEventListener('click', () => importFile.click());
    importFile.addEventListener('change', () => { if (importFile.files[0]) importLibrary(importFile.files[0]); importFile.value=''; });
  }
  const signOutBtn = document.getElementById('sign-out-btn');
  if (signOutBtn) signOutBtn.addEventListener('click', signOutUser);
}

document.getElementById('sheet').addEventListener('click', (e) => {
  const setStatus = e.target.closest('[data-set-status]');
  if (setStatus) return setAnimeStatus(setStatus.getAttribute('data-set-status'));
  const setRating = e.target.closest('[data-set-rating]');
  if (setRating) return setAnimeRating(setRating.getAttribute('data-set-rating'));
  const addWith = e.target.closest('[data-add-with-status]');
  if (addWith) return confirmAddWithStatus(addWith.getAttribute('data-add-with-status'));

  const deleteNotification = e.target.closest('[data-delete-notification]');
  if (deleteNotification) return deleteNotificationById(deleteNotification.getAttribute('data-delete-notification'));

  if (e.target.id === 'cancel-delete') return closeSheet();
  if (e.target.id === 'confirm-delete') return deleteCurrentAnime();
});

document.getElementById('btn-search').addEventListener('click', goSearch);
document.getElementById('btn-settings').addEventListener('click', goSettings);
document.getElementById('btn-bell').addEventListener('click', openNotifications);

/* =========================================================
   Boot
========================================================= */
(function boot(){
  applyTheme();
  render();
  setupPullToRefresh();
  // Library/settings/notifications populate once Firestore sync starts
  // after login (see startCloudSync), which also triggers the initial
  // refreshComebacks() run once a TMDB key is available.
})();

})();
