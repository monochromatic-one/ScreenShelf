<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>𝕾𝖈𝖗𝖊𝖊𝖓𝕾𝖍𝖊𝖑𝖋 🍥</title>
<meta name="theme-color" content="#121319">
<link rel="manifest" href="./manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root[data-theme="dark"]{
    --bg:#121319; --surface:#1a1c24; --surface-2:#21232d; --surface-3:#282b37;
    --text:#edeef3; --muted:#90939f; --border:rgba(255,255,255,.07); --border-strong:rgba(255,255,255,.14);
    --accent:#e3a23b; --accent-text:#1a1206; --danger:#e0616b; --shadow: 0 12px 32px rgba(0,0,0,.35);
    --scrim: rgba(8,9,12,.6);
  }
  :root[data-theme="light"]{
    --bg:#f5f3ee; --surface:#ffffff; --surface-2:#efece4; --surface-3:#e6e2d8;
    --text:#1c1c1a; --muted:#6d6a62; --border:rgba(20,18,10,.09); --border-strong:rgba(20,18,10,.16);
    --accent:#c47f1f; --accent-text:#fffaf0; --danger:#b6414c; --shadow: 0 12px 28px rgba(30,25,10,.12);
    --scrim: rgba(30,26,16,.4);
  }
  .status-watching{ --status-color:#e3a23b; }
  .status-planned{ --status-color:#5fa3a0; }
  .status-comeback{ --status-color:#9b8ce0; }
  .status-finished{ --status-color:#6fa679; }
  .status-dropped{ --status-color:#c97b84; }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  button, input{ font-family:inherit; color:inherit; }
  button{ cursor:pointer; }
  img{ display:block; max-width:100%; }
  ::selection{ background:var(--accent); color:var(--accent-text); }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:6px; }

  .app-shell{ min-height:100%; display:flex; flex-direction:column; }

  /* ---------- Topbar ---------- */
  .topbar{
    position:sticky; top:0; z-index:20; display:flex; align-items:center; justify-content:space-between;
    padding: max(14px, env(safe-area-inset-top)) 18px 14px; background:linear-gradient(var(--bg) 65%, transparent);
    backdrop-filter: blur(6px);
  }
  .brand{ display:flex; align-items:baseline; gap:8px; }
  .brand-mark{ font-size:20px; }
  .brand-name{ font-weight:800; font-size:17px; letter-spacing:.01em; }
  .brand-screen{ color:var(--text); }
  .brand-shelf{ color:var(--accent); }
  .brand-sub{ color:var(--muted); font-size:13px; }
  .topbar-actions{ display:flex; gap:6px; }
  .icon-btn{
    position:relative; width:40px; height:40px; border-radius:12px; border:1px solid var(--border);
    background:var(--surface); font-size:17px; display:flex; align-items:center; justify-content:center;
    transition: background .15s ease, transform .1s ease, border-color .15s ease;
  }
  .icon-btn:hover{ background:var(--surface-2); }
  .icon-btn:active{ transform: scale(.94); }
  .badge{
    position:absolute; top:-4px; right:-4px; min-width:17px; height:17px; padding:0 4px; border-radius:9px;
    background:var(--accent); color:var(--accent-text); font-size:10.5px; font-weight:700;
    display:flex; align-items:center; justify-content:center; line-height:1;
  }

  .main{ flex:1; padding: 4px 16px 96px; max-width:720px; width:100%; margin:0 auto; }
  @media (min-width: 860px){ .main{ max-width: 820px; padding-left:0; padding-right:0; } }

  .hero-glow{
    height:1px; margin: 2px 0 18px; background:
      radial-gradient(60% 100% at 20% 0%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 70%);
    height:64px; margin-top:-64px; pointer-events:none; position:relative; z-index:-1;
  }

  /* ---------- Status sections ---------- */
  .status-section{ border-top:1px solid var(--border); }
  .status-section:last-child{ border-bottom:1px solid var(--border); }
  .status-header{
    width:100%; display:flex; align-items:center; gap:10px; background:none; border:none;
    padding:15px 4px; text-align:left; font-size:15.5px; font-weight:700; color:var(--text);
  }
  .status-dot{ width:8px; height:8px; border-radius:50%; background:var(--status-color); flex:none; }
  .status-emoji{ font-size:16px; }
  .status-count{ margin-left:auto; color:var(--muted); font-weight:600; font-size:13.5px; }
  .status-caret{ color:var(--muted); font-size:12px; transition:transform .18s ease; margin-left:2px; }
  .status-header[aria-expanded="true"] .status-caret{ transform:rotate(90deg); }
  .status-list{ display:grid; grid-template-rows:0fr; overflow:hidden; transition:grid-template-rows .25s ease; }
  .status-list.open{ grid-template-rows:1fr; }
  .status-list-inner{ min-height:0; overflow:hidden; padding-bottom:10px; }
  .status-empty{ color:var(--muted); font-size:13.5px; padding:14px 4px 20px; text-align:center; line-height:1.5; }
  .main.main-flex-fill{ display:flex; flex-direction:column; }
  .watched-time-stat{ text-align:center; padding:26px 12px 10px; margin-top:auto; }
  .watched-time-main{ font-size:12.5px; }
  .watched-time-label{ font-weight:700; color:var(--muted); }
  .watched-time-value{ font-weight:400; color:var(--muted); }
  .watched-time-sub{ font-size:11px; color:var(--muted); opacity:.75; margin-top:3px; }

  .anime-row{
    width:100%; display:flex; align-items:center; gap:12px; background:none; border:none; border-top:1px solid var(--border);
    padding:9px 4px; text-align:left;
  }
  .status-list-inner .anime-row:first-child{ border-top:none; }
  .anime-row:hover{ background:var(--surface); border-radius:10px; }
  .poster-thumb{
    width:40px; height:56px; border-radius:6px; object-fit:cover; background:var(--surface-2); flex:none;
    border:1px solid var(--border);
  }
  .anime-title{ font-size:14.5px; font-weight:600; line-height:1.3; }
  .own-library-row .anime-title-wrap{ min-width:0; flex:1; }
  .own-library-row .anime-title{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .library-rating{ width:15px; flex:none; color:var(--muted); font-size:15px; line-height:1; text-align:center; }
  .library-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(96px, 1fr)); gap:10px; padding:0 4px; }
  .library-grid-tile{
    position:relative; display:block; min-width:0; padding:0; overflow:hidden; text-align:left;
    background:transparent; border:0; border-radius:8px; color:var(--text);
  }
  .library-grid-tile:active{ transform:scale(.98); }
  .library-grid-poster{
    width:100%; aspect-ratio:2/3; border:1px solid var(--border); border-radius:8px;
    background:var(--surface-2); object-fit:cover;
  }
  .library-grid-title{
    display:block; overflow:hidden; margin-top:6px; color:var(--text); font-size:12px; font-weight:600;
    line-height:1.3; text-overflow:ellipsis; white-space:nowrap;
  }
  .library-grid-rating{
    position:absolute; top:5px; right:5px; display:flex; align-items:center; justify-content:center;
    min-width:24px; min-height:24px; padding:2px; border:1px solid var(--border-strong); border-radius:999px;
    background:color-mix(in srgb, var(--surface) 90%, transparent); box-shadow:0 2px 6px rgba(0,0,0,.2);
    font-size:14px; line-height:1;
  }

  /* ---------- Empty state ---------- */
  .empty-block{ padding:56px 10px; text-align:center; }
  .empty-emoji{ font-size:34px; margin-bottom:10px; }
  .empty-title{ font-weight:700; font-size:16px; margin-bottom:6px; }
  .empty-text{ color:var(--muted); font-size:14px; max-width:320px; margin:0 auto 18px; line-height:1.5; }

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px; border-radius:12px; border:1px solid transparent;
    padding:11px 18px; font-weight:700; font-size:14px; transition: filter .15s ease, transform .1s ease;
  }
  .btn:active{ transform:scale(.97); }
  .btn-accent{ background:var(--accent); color:var(--accent-text); }
  .btn-accent:hover{ filter:brightness(1.08); }
  .btn-ghost{ background:var(--surface); border-color:var(--border); color:var(--text); }
  .btn-ghost:hover{ background:var(--surface-2); }
  .btn-danger{ background:transparent; border-color:var(--danger); color:var(--danger); }
  .btn-danger:hover{ background:color-mix(in srgb, var(--danger) 12%, transparent); }
  .btn-block{ width:100%; }
  .btn-sm{ padding:8px 12px; font-size:13px; border-radius:10px; }

  /* ---------- View header (back nav) ---------- */
  .view-head{ display:flex; align-items:center; gap:10px; padding:10px 4px 6px; }
  .back-btn{
    background:var(--accent); border:1px solid var(--accent); color:var(--accent-text);
    font-size:14px; font-weight:700; display:flex; align-items:center; gap:6px;
    padding:8px 11px; border-radius:10px;
  }
  .back-btn:hover{ filter:brightness(1.08); }
  .view-title{ font-size:16px; font-weight:800; }
  .settings-view-head .view-title{ margin-left:auto; }

  /* ---------- Search ---------- */
  .search-box{ display:flex; gap:8px; padding:6px 4px 16px; position:sticky; top:66px; background:var(--bg); z-index:5; }
  .search-input{
    flex:1; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:11px 14px;
    font-size:14.5px; color:var(--text);
  }
  .search-input:focus{ border-color:var(--accent); }
  .search-hint{ color:var(--muted); font-size:13.5px; padding:8px 6px 20px; line-height:1.5; }
  .search-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(128px,1fr)); gap:14px; padding:4px; }
  .search-card{ background:none; border:none; text-align:left; padding:0; }
  .search-poster{ width:100%; aspect-ratio:2/3; border-radius:10px; object-fit:cover; background:var(--surface-2); border:1px solid var(--border); margin-bottom:7px; }
  .search-card-title{ font-size:13px; font-weight:600; line-height:1.3; }
  .search-card-owned{ font-size:11px; color:var(--accent); font-weight:700; margin-top:2px; }

  /* ---------- Detail ---------- */
  .detail-hero{ text-align:center; padding:6px 4px 18px; }
  .detail-title{ font-size:19px; font-weight:800; margin:0 0 16px; line-height:1.3; }
  .detail-poster-wrap{ position:relative; max-width:230px; margin:0 auto; }
  .detail-poster{ width:100%; aspect-ratio:2/3; border-radius:16px; object-fit:cover; background:var(--surface-2); border:1px solid var(--border); box-shadow:var(--shadow); }
  .detail-stats{
    display:inline-flex; gap:8px; align-items:center; margin-top:14px; background:var(--surface); border:1px solid var(--border);
    padding:7px 14px; border-radius:999px; font-size:12.5px; font-weight:700; color:var(--muted);
  }
  .detail-stats b{ color:var(--text); }
  .tmdb-score{ display:flex; align-items:center; justify-content:center; gap:5px; margin-top:9px; font-size:12px; color:var(--muted); font-weight:700; }
  .tmdb-score-mark{ color:#01b4e4; font-size:10px; font-weight:900; letter-spacing:-.35px; }
  .tmdb-score-value{ color:var(--text); }
  .detail-tmdb-status{ margin-top:9px; font-size:12.5px; color:var(--muted); }
  .detail-actions{ padding:8px 4px 22px; display:flex; flex-direction:column; gap:10px; }
  .status-pill{
    display:inline-flex; align-items:center; gap:7px; font-size:12.5px; font-weight:700; padding:7px 13px 7px 10px;
    border-radius:999px; background:var(--surface); border:1px solid var(--border); align-self:center;
  }
  .status-pill .status-dot{ width:7px; height:7px; }
  .detail-meta-row{ display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap; }
  .rating-pill{
    display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:700; padding:7px 13px 7px 10px;
    border-radius:999px; background:var(--surface); border:1px solid var(--border); color:var(--muted);
  }
  .rating-pill:hover{ background:var(--surface-2); }
  .rating-pill .rating-emoji{ font-size:15px; color:var(--text); }

  .section-label{ font-size:12.5px; font-weight:700; color:var(--muted); padding:18px 4px 8px; }
  .season-row{ border-top:1px solid var(--border); }
  .season-head{ width:100%; display:flex; align-items:center; gap:10px; background:none; border:none; padding:13px 4px; text-align:left; }
  .season-name{ font-size:14.5px; font-weight:600; flex:1; }
  .season-check{
    width:22px; height:22px; border-radius:7px; border:1.5px solid var(--border-strong); flex:none;
    display:flex; align-items:center; justify-content:center; font-size:13px; background:var(--surface);
  }
  .season-check.checked{ background:var(--accent); border-color:var(--accent); color:var(--accent-text); }

  /* ---------- Settings ---------- */
  .profile-row{ display:flex; align-items:center; gap:16px; }
  .avatar-wrap{
    position:relative; width:64px; height:64px; border-radius:50%; flex:none;
    background:var(--surface-2); border:1px solid var(--border-strong);
    display:flex; align-items:center; justify-content:center; overflow:hidden;
  }
  .avatar-img{ width:100%; height:100%; object-fit:cover; display:none; }
  .avatar-img.has-photo{ display:block; }
  .avatar-fallback{ font-size:26px; }
  .avatar-wrap.uploading::after{
    content:''; position:absolute; inset:0; background:var(--scrim);
  }
  .avatar-spinner{ position:absolute; inset:0; display:none; align-items:center; justify-content:center; font-size:16px; }
  .avatar-wrap.uploading .avatar-spinner{ display:flex; }
  .profile-info{ flex:1; min-width:0; }
  .profile-name-row{ display:flex; align-items:center; gap:8px; }
  .profile-name{ font-size:15.5px; font-weight:750; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .name-edit-btn{
    background:none; border:none; color:var(--accent); font-size:12.5px; font-weight:700; padding:2px 4px; flex:none;
  }
  .profile-name-edit-row{ display:flex; gap:6px; align-items:center; }
  .profile-name-input{
    flex:1; background:var(--surface); border:1px solid var(--border); border-radius:9px; padding:7px 10px; font-size:14px; min-width:0;
  }
  .profile-name-input:focus{ border-color:var(--accent); }
  .profile-name-save{ background:var(--accent); color:var(--accent-text); border:none; border-radius:9px; padding:7px 10px; font-size:12.5px; font-weight:700; flex:none; }
  .profile-name-cancel{ background:none; border:none; color:var(--muted); font-size:12.5px; padding:7px 6px; flex:none; }
  .profile-email{ font-size:12.5px; color:var(--muted); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .change-pic-btn{ margin-top:10px; }
  .avatar-error{ font-size:12px; color:var(--danger); margin-top:8px; }
  .field{ margin-bottom:18px; }
  .field-label{ font-size:13px; font-weight:700; margin-bottom:7px; display:block; }
  .field-help{ font-size:12px; color:var(--muted); margin-top:6px; line-height:1.5; }
  .field-input{ width:100%; background:var(--surface); border:1px solid var(--border); border-radius:11px; padding:11px 13px; font-size:14px; }
  .field-input:focus{ border-color:var(--accent); }
  .row{ display:flex; gap:10px; align-items:center; }
  .test-status{ font-size:12.5px; margin-top:9px; font-weight:600; }
  .test-status.ok{ color:#6fa679; }
  .test-status.err{ color:var(--danger); }
  .theme-row{ display:flex; gap:10px; }
  .theme-opt{ flex:1; padding:12px; border-radius:12px; border:1.5px solid var(--border); background:var(--surface); text-align:center; font-size:13px; font-weight:700; }
  .theme-opt.active{ border-color:var(--accent); color:var(--accent); }
  .swatches{ display:flex; gap:9px; flex-wrap:wrap; margin-top:2px; }
  .swatch{ width:30px; height:30px; border-radius:9px; border:2px solid transparent; }
  .swatch.active{ border-color:var(--text); }
  .divider{ height:1px; background:var(--border); margin:22px 0; }
  .import-export-row{ display:flex; gap:10px; }
  .import-export-row .btn{ flex:1; }

  /* ---------- Modal / overlay ---------- */
  .overlay{
    position:fixed; inset:0; background:var(--scrim); z-index:50; display:flex; align-items:flex-end; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity .18s ease;
  }
  .overlay.show{ opacity:1; pointer-events:auto; }
  @media (min-width:640px){ .overlay{ align-items:center; } }
  .sheet{
    width:100%; max-width:420px; background:var(--surface); border:1px solid var(--border); border-radius:20px 20px 0 0;
    padding: 8px 8px max(20px, env(safe-area-inset-bottom)); box-shadow:var(--shadow);
    transform:translateY(16px); transition:transform .18s ease;
  }
  .overlay.show .sheet{ transform:translateY(0); }
  @media (min-width:640px){ .sheet{ border-radius:20px; } }
  .sheet-grip{ width:36px; height:4px; border-radius:2px; background:var(--border-strong); margin:6px auto 12px; }
  .sheet-title{ font-size:15px; font-weight:800; padding:0 10px 14px; }
  .sheet-text{ font-size:13.5px; color:var(--muted); padding:0 10px 16px; line-height:1.5; }
  .status-choice{
    width:100%; display:flex; align-items:center; gap:11px; padding:13px 12px; border-radius:12px; border:none; background:none;
    text-align:left; font-size:14.5px; font-weight:600;
  }
  .status-choice:hover{ background:var(--surface-2); }
  .status-choice.current{ color:var(--accent); }
  .status-choice .status-dot{ width:9px; height:9px; }
  .rating-choice{
    width:100%; display:flex; align-items:center; gap:11px; padding:13px 12px; border-radius:12px; border:none; background:none;
    text-align:left; font-size:14.5px; font-weight:600;
  }
  .rating-choice:hover{ background:var(--surface-2); }
  .rating-choice.current{ background:var(--surface-2); color:var(--accent); }
  .rating-choice .rating-choice-emoji{ font-size:19px; }
  .sheet-actions{ display:flex; gap:10px; padding:6px 10px 4px; }
  .sheet-actions .btn{ flex:1; }

  /* ---------- Notifications ---------- */
  .notif-empty{ padding:44px 20px; text-align:center; color:var(--muted); font-size:13.5px; }
  .notif-item{ padding:13px 10px; border-top:1px solid var(--border); display:flex; gap:11px; }
  .notif-list .notif-item:first-child{ border-top:none; }
  .notif-item.unread{ background:color-mix(in srgb, var(--accent) 7%, transparent); border-radius:10px; }
  .notif-dot{ width:7px; height:7px; border-radius:50%; background:var(--accent); margin-top:6px; flex:none; }
  .notif-dot.read{ background:transparent; }
  .notif-body{ flex:1; }
  .notif-title{ font-size:13.5px; font-weight:700; line-height:1.4; }
  .notif-time{ font-size:11.5px; color:var(--muted); margin-top:3px; }
  .notif-delete{
    width:32px; height:32px; flex:none; align-self:center; border:1px solid var(--border);
    border-radius:9px; background:var(--surface); display:flex; align-items:center; justify-content:center;
    font-size:13px; padding:0; opacity:.72;
  }
  .notif-delete:hover{ background:var(--surface-2); opacity:1; }

  /* ---------- Loading / toast ---------- */
  .spinner{ font-size:30px; display:inline-block; animation:spin 1.1s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .loading-block{ padding:70px 0; text-align:center; color:var(--muted); }
  .loading-block .spinner{ margin-bottom:10px; }
  .inline-loading{ display:flex; align-items:center; gap:10px; color:var(--muted); font-size:13px; padding:14px 4px; }
  .inline-loading .spinner{ font-size:18px; }

  .toast-wrap{ position:fixed; left:0; right:0; bottom:18px; display:flex; justify-content:center; z-index:80; pointer-events:none; }
  .toast{
    background:var(--surface-3); border:1px solid var(--border-strong); color:var(--text); padding:11px 18px; border-radius:12px;
    font-size:13.5px; font-weight:600; box-shadow:var(--shadow); transform:translateY(8px); opacity:0; transition:all .2s ease;
    max-width:85vw;
  }
  .toast.show{ transform:translateY(0); opacity:1; }

  .pull-indicator{ display:flex; justify-content:center; align-items:center; height:0; overflow:hidden; transition:height .15s ease; color:var(--muted); }
  .pull-indicator.active{ height:44px; }

  .delete-fab{ display:flex; justify-content:center; padding:6px 4px 10px; }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.001s !important; transition-duration:.001s !important; }
  }
  .media-tabs{display:flex;margin:0 0 14px;border-bottom:1px solid var(--border);}
  .media-tab{flex:1;padding:11px 8px;background:transparent;border:0;border-bottom:2px solid transparent;color:var(--muted);font:inherit;font-weight:700;cursor:pointer;}
  .media-tab{font-size:15px;letter-spacing:.01em}.media-tab.active{color:var(--text);border-bottom-color:var(--accent);}
  .sort-row{ display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--muted); font-weight:600; padding:0 4px 10px; }
  .sort-row select{

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js';
import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  signInWithEmailAndPassword,
  createUserWithEmailAndPassword,
  sendPasswordResetEmail,
  sendEmailVerification,
  reload,
  onAuthStateChanged,
  signOut
} from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js';
import {
  initializeFirestore,
  persistentLocalCache,
  persistentMultipleTabManager,
  collection,
  doc,
  onSnapshot,
  setDoc,
  deleteDoc,
  serverTimestamp,
  getDoc,
  getDocs,
  query,
  where,
  runTransaction
} from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js';
const firebaseConfig = {
  apiKey: "AIzaSyDcfuKP-nVjm6s6CMn-T4V_ck_cAtLnnf8",
  authDomain: "screenshelf.firebaseapp.com",
  projectId: "screenshelf",
  messagingSenderId: "560556587757",
  appId: "1:560556587757:web:41bd5b322fd837b935aae4"
};

const firebaseApp = initializeApp(firebaseConfig);
const firebaseAuth = getAuth(firebaseApp);

/* Cloud Firestore: persistent local cache + multi-tab sync */
const firebaseDb = initializeFirestore(firebaseApp, {
  localCache: persistentLocalCache({
    tabManager: persistentMultipleTabManager()
  })
});

window.ScreenShelfFirebase = {
  app: firebaseApp,
  auth: firebaseAuth,
  db: firebaseDb
};

/* =========================================================
   Firebase Authentication
========================================================= */
(function setupFirebaseAuth(){
  const gate = document.getElementById('screenshelf-auth-gate');
  const subtitle = document.getElementById('auth-subtitle');
  const choice = document.getElementById('auth-choice');
  const emailForm = document.getElementById('auth-email-form');
  const resetForm = document.getElementById('auth-reset-form');
  const verification = document.getElementById('auth-verification');
  const googleBtn = document.getElementById('auth-google');
  const emailBtn = document.getElementById('auth-email');
  const backBtn = document.getElementById('auth-back');
  const emailInput = document.getElementById('auth-email-input');
  const passwordInput = document.getElementById('auth-password-input');
  const signInBtn = document.getElementById('auth-signin');
  const createBtn = document.getElementById('auth-create');
  const forgotPasswordBtn = document.getElementById('auth-forgot-password');
  const resetEmailInput = document.getElementById('auth-reset-email');
  const sendResetBtn = document.getElementById('auth-send-reset');
  const resetBackBtn = document.getElementById('auth-reset-back');
  const verificationCopy = document.getElementById('auth-verification-copy');
  const verificationEmail = document.getElementById('auth-verification-email');
  const checkVerificationBtn = document.getElementById('auth-check-verification');
  const resendVerificationBtn = document.getElementById('auth-resend-verification');
  const verificationSignOutBtn = document.getElementById('auth-verification-signout');
  const loading = document.getElementById('auth-loading');
  const message = document.getElementById('auth-message');

  function setBusy(busy){
    googleBtn.disabled = busy;
    emailBtn.disabled = busy;
    backBtn.disabled = busy;
    signInBtn.disabled = busy;
    createBtn.disabled = busy;
    forgotPasswordBtn.disabled = busy;
    sendResetBtn.disabled = busy;
    resetBackBtn.disabled = busy;
    checkVerificationBtn.disabled = busy;
    resendVerificationBtn.disabled = busy;
    verificationSignOutBtn.disabled = busy;
    loading.style.display = busy ? 'block' : 'none';
  }

  function showMessage(text, tone = 'error'){
    message.textContent = text || '';
    message.classList.toggle('success', !!text && tone === 'success');
  }

  function authActionSettings(){
    return { url: window.location.href, handleCodeInApp: false };
  }

  function requiresEmailVerification(user){
    return !!(user && user.email && !user.emailVerified);
  }

  function showEmailForm(){
    gate.style.display = 'flex';
    subtitle.textContent = 'Sign in with your email';
    choice.style.display = 'none';
    resetForm.style.display = 'none';
    verification.style.display = 'none';
    emailForm.style.display = 'block';
    showMessage('');
    emailInput.focus();
  }

  function showPasswordReset(){
    gate.style.display = 'flex';
    subtitle.textContent = 'Password help';
    choice.style.display = 'none';
    emailForm.style.display = 'none';
    verification.style.display = 'none';
    resetForm.style.display = 'block';
    resetEmailInput.value = emailInput.value.trim();
    showMessage('');
    resetEmailInput.focus();
  }

  function showVerification(user, verificationEmailWasSent = false){
    gate.style.display = 'flex';
    subtitle.textContent = 'One quick security step';
    choice.style.display = 'none';
    emailForm.style.display = 'none';
    resetForm.style.display = 'none';
    verification.style.display = 'block';
    verificationEmail.textContent = user && user.email ? user.email : '';
    verificationCopy.textContent = verificationEmailWasSent
      ? 'We sent a verification link to this address. Open it, then come back here to continue.'
      : 'Confirm that you own this address before using ScreenShelf. Check your inbox, or send a fresh verification link.';
  }

  function showChoices(){
    gate.style.display = 'flex';
    subtitle.textContent = 'Your personal anime and series tracker';
    choice.style.display = 'block';
    emailForm.style.display = 'none';
    resetForm.style.display = 'none';
    verification.style.display = 'none';
    showMessage('');
  }

  function showAuthLoading(){
    gate.style.display = 'flex';
    subtitle.textContent = 'Checking your session…';
    choice.style.display = 'none';
    emailForm.style.display = 'none';
    resetForm.style.display = 'none';
    verification.style.display = 'none';
    loading.textContent = 'Checking your session…';
    loading.style.display = 'block';
    showMessage('');
  }

  function showLoginChoices(){
    showChoices();
    loading.textContent = 'Signing in…';
    loading.style.display = 'none';
  }

  function friendlyAuthError(error){
    switch(error.code){
      case 'auth/invalid-credential': return 'Email or password is incorrect.';
      case 'auth/email-already-in-use': return 'An account already exists with this email.';
      case 'auth/weak-password': return 'Password must be at least 6 characters.';
      case 'auth/invalid-email': return 'Please enter a valid email address.';
      case 'auth/too-many-requests': return 'Too many attempts. Please wait a little and try again.';
      case 'auth/network-request-failed': return 'Network error. Check your connection and try again.';
      case 'auth/popup-closed-by-user': return 'Google sign-in was cancelled.';
      case 'auth/popup-blocked': return 'Your browser blocked the Google sign-in popup.';
      case 'auth/unauthorized-domain': return 'This website is not authorized for Firebase sign-in yet.';
      case 'auth/unauthorized-continue-uri': return 'This website is not authorized for Firebase email links yet.';
      case 'auth/invalid-continue-uri': return 'This website is not configured correctly for Firebase email links yet.';
      default: return error.message || 'Sign-in failed. Please try again.';
    }
  }

  function startVerifiedSession(user){
    gate.style.display = 'none';
    try {
      window.ScreenShelfFirebase.startCloudSync(user);
    } catch(error) {
      console.error('Cloud sync failed to start:', error);
    }
  }

  async function sendVerification(user){
    await sendEmailVerification(user, authActionSettings());
    showVerification(user, true);
    showMessage('Verification email sent. Check your inbox and spam folder.', 'success');
  }

  googleBtn.addEventListener('click', async () => {
    showMessage('');
    setBusy(true);
    try {
      const provider = new GoogleAuthProvider();
      await signInWithPopup(firebaseAuth, provider);
    } catch(error) {
      console.error('Google sign-in failed:', error);
      showMessage(friendlyAuthError(error));
    } finally {
      setBusy(false);
    }
  });

  emailBtn.addEventListener('click', showEmailForm);
  backBtn.addEventListener('click', showChoices);
  forgotPasswordBtn.addEventListener('click', showPasswordReset);
  resetBackBtn.addEventListener('click', showEmailForm);

  emailForm.addEventListener('submit', async (event) => {
    event.preventDefault();
    showMessage('');
    setBusy(true);
    try {
      await signInWithEmailAndPassword(
        firebaseAuth,
        emailInput.value.trim(),
        passwordInput.value
      );
    } catch(error) {
      console.error('Email sign-in failed:', error);
      showMessage(friendlyAuthError(error));
    } finally {
      setBusy(false);
    }
  });

  createBtn.addEventListener('click', async () => {
    showMessage('');
    if (!emailForm.reportValidity()) return;
    setBusy(true);
    try {
      const credential = await createUserWithEmailAndPassword(
        firebaseAuth,
        emailInput.value.trim(),
        passwordInput.value
      );
      await sendVerification(credential.user);
    } catch(error) {
      console.error('Account creation failed:', error);
      showMessage(friendlyAuthError(error));
    } finally {
      setBusy(false);
    }
  });

  resetForm.addEventListener('submit', async (event) => {
    event.preventDefault();
    if (!resetForm.reportValidity()) return;
    showMessage('');
    setBusy(true);
    try {
      await sendPasswordResetEmail(firebaseAuth, resetEmailInput.value.trim(), authActionSettings());
      showMessage('If an email/password account exists for that address, a password-reset link has been sent. Check your inbox and spam folder.', 'success');
    } catch(error) {
      // Do not reveal whether an address is registered when the Firebase
      // project has email-enumeration protection disabled.
      if (error.code === 'auth/user-not-found') {
        showMessage('If an email/password account exists for that address, a password-reset link has been sent. Check your inbox and spam folder.', 'success');
      } else {
        console.error('Password reset email failed:', error);
        showMessage(friendlyAuthError(error));
      }
    } finally {
      setBusy(false);
    }
  });

  resendVerificationBtn.addEventListener('click', async () => {
    const user = firebaseAuth.currentUser;
    if (!user) return showLoginChoices();
    showMessage('');
    setBusy(true);
    try {
      await sendVerification(user);
    } catch(error) {
      console.error('Verification email failed:', error);
      showMessage(friendlyAuthError(error));
    } finally {
      setBusy(false);
    }
  });

  checkVerificationBtn.addEventListener('click', async () => {
    const user = firebaseAuth.currentUser;
    if (!user) return showLoginChoices();
    showMessage('');
    setBusy(true);
    try {
      await reload(user);
      if (requiresEmailVerification(user)) {

        showMessage('Your email is not verified yet. Open the link from the email, then try again.');
        return;

      console.error('Verification refresh failed:', error);
      showMessage(friendlyAuthError(error));
    } finally {
      setBusy(false);
    }
  });

    setBusy(true);
    try {
      await signOut(firebaseAuth);
    } catch(error) {
      console.error('Verification sign-out failed:', error);
      showMessage(friendlyAuthError(error));
    } finally {
      setBusy(false);
    }
  });

  showAuthLoading();

  onAuthStateChanged(firebaseAuth, (user) => {
    if (requiresEmailVerification(user)) {
      // Do not attach any Firestore listeners until the user controls the
      // email address used for this email/password account.
      try { window.ScreenShelfFirebase.stopCloudSync(); } catch(error) { console.error('Cloud sync teardown failed:', error); }
      showVerification(user);
    } else if (user) {
      startVerifiedSession(user);
    } else {
      try { window.ScreenShelfFirebase.stopCloudSync(); } catch(error) { console.error('Cloud sync teardown failed:', error); }
      showLoginChoices();
    }
  });
})();

/* ---- Permanent Friend Code + public profile bootstrap. ----
   A transaction claims the code document and writes the immutable code on
   the private owner profile together. The public profile contains only the
   two fields friends are allowed to see. */
async function ensureFriendIdentity(){
  if (!cloudSyncUser) return '';
  if (friendIdentityPromise && friendIdentityUserId === cloudSyncUser.uid) return friendIdentityPromise;

  const currentUser = cloudSyncUser;
  const profileRef = doc(firebaseDb, 'users', currentUser.uid);
  const publicProfileRef = doc(firebaseDb, 'publicProfiles', currentUser.uid);

  friendIdentityUserId = currentUser.uid;
  friendIdentityPromise = (async () => {
    let lastError = null;
    for (let attempt = 0; attempt < 8; attempt++){
      const candidate = generateFriendCode();
      try {
        const claimedCode = await runTransaction(firebaseDb, async transaction => {
          const profileSnap = await transaction.get(profileRef);
          const profile = profileSnap.exists() ? profileSnap.data() : {};
          const existingCode = isValidFriendCode(profile.friendCode) ? profile.friendCode : '';
          const code = existingCode || candidate;
          const codeRef = doc(firebaseDb, 'friendCodes', code);
          const [codeSnap, publicSnap] = await Promise.all([
            transaction.get(codeRef),
            transaction.get(publicProfileRef),
          ]);

          if (codeSnap.exists() && codeSnap.data().uid !== currentUser.uid){
            if (existingCode) throw new Error('FRIEND_CODE_CONFLICT');
            throw new Error('FRIEND_CODE_COLLISION');
          }

          // Preserve an existing code forever; otherwise claim this candidate.
          if (!codeSnap.exists()){
            transaction.set(codeRef, { uid: currentUser.uid, createdAt: serverTimestamp() });
          }
          if (!existingCode){
            transaction.set(profileRef, { friendCode: code, updatedAt: serverTimestamp() }, { merge: true });
          }
          if (!hasSafePublicProfile(publicSnap.exists() ? publicSnap.data() : null)){
            transaction.set(publicProfileRef, {
              displayName: publicDisplayName(),
              photoURL: publicPhotoURL(),
              updatedAt: serverTimestamp(),
            }, { merge: true });
          }
          return code;
        });
        if (cloudSyncUser && cloudSyncUser.uid === currentUser.uid) state.friends.friendCode = claimedCode;
        return claimedCode;
      } catch(error) {
        lastError = error;
        if (error && error.message === 'FRIEND_CODE_COLLISION') continue;
        throw error;
      }
    }
    throw lastError || new Error('Could not claim a Friend Code.');
  })();

  try {
    return await friendIdentityPromise;
  } finally {
    if (friendIdentityUserId === currentUser.uid){
      friendIdentityPromise = null;
      friendIdentityUserId = null;
    }
  }
}

    const incomingRef = collection(firebaseDb, 'friendRequests');
    const [incomingSnap, outgoingSnap, friendshipSnap] = await Promise.all([
      getDocs(query(incomingRef, where('toUid', '==', currentUid))),
      getDocs(query(incomingRef, where('fromUid', '==', currentUid))),
      getDocs(query(friendshipsRef, where('users', 'array-contains', currentUid))),
    ]);

    state.friends.incoming = incomingSnap.docs.map(snapshot => {
      const data = snapshot.data();
      return {
        id: snapshot.id,
        fromUid: String(data.fromUid || ''),
        toUid: String(data.toUid || ''),
        displayName: String(data.fromDisplayName || 'ScreenShelf user'),
        photoURL: normalizeProfilePhoto(data.fromPhotoURL),
        createdAt: localMillis(data.createdAt),
      };
    }).filter(request => request.fromUid && request.toUid === currentUid);

    state.friends.outgoing = outgoingSnap.docs.map(snapshot => {
      const data = snapshot.data();
      return {
        id: snapshot.id,
        fromUid: String(data.fromUid || ''),
        toUid: String(data.toUid || ''),
        createdAt: localMillis(data.createdAt),
      };
    }).filter(request => request.toUid && request.fromUid === currentUid);

    const friendUids = friendshipSnap.docs.map(snapshot => {
      const users = snapshot.data().users;
      return Array.isArray(users) ? users.find(uid => uid !== currentUid) : '';
    }).filter(Boolean);
    const profiles = await Promise.all(friendUids.map(uid => getDoc(doc(firebaseDb, 'publicProfiles', uid))));
    state.friends.list = friendUids.map((uid, index) => {
      const profile = profiles[index];
      const data = profile.exists() ? profile.data() : {};
      return {
        uid,
        displayName: String(data.displayName || 'Deleted ScreenShelf user'),
        photoURL: normalizeProfilePhoto(data.photoURL),
      };
    }).sort((a, b) => a.displayName.localeCompare(b.displayName));
  } catch(error) {
    console.warn('Could not load Friends:', error);
    state.friends.error = friendErrorMessage(error);
  } finally {
    state.friends.loading = false;
    if (friendIsOpen()) renderFriendsSheet();
  }
}

async function sendFriendRequest(rawCode){
  if (!cloudSyncUser) return;
  const code = String(rawCode || '').trim().toUpperCase();
  if (!isValidFriendCode(code)) throw new Error('FRIEND_CODE_INVALID');
  if (!navigator.onLine) throw new Error('FRIENDS_OFFLINE');

  await ensureFriendIdentity();
  const currentUid = cloudSyncUser.uid;
  const codeSnap = await getDoc(doc(firebaseDb, 'friendCodes', code));
  if (!codeSnap.exists() || !codeSnap.data().uid) throw new Error('FRIEND_CODE_NOT_FOUND');
  const targetUid = String(codeSnap.data().uid);
  if (targetUid === currentUid) throw new Error('FRIEND_CODE_SELF');

  await runTransaction(firebaseDb, async transaction => {
    const requestRef = doc(firebaseDb, 'friendRequests', friendRequestId(currentUid, targetUid));
    const oppositeRequestRef = doc(firebaseDb, 'friendRequests', friendRequestId(targetUid, currentUid));
    const friendshipRef = doc(firebaseDb, 'friendships', friendshipId(currentUid, targetUid));
    const ownPublicProfileRef = doc(firebaseDb, 'publicProfiles', currentUid);
    const [friendshipSnap, requestSnap, oppositeRequestSnap, publicProfileSnap] = await Promise.all([
      transaction.get(friendshipRef),
      transaction.get(requestRef),
      transaction.get(oppositeRequestRef),
      transaction.get(ownPublicProfileRef),
    ]);

    if (friendshipSnap.exists()) throw new Error('FRIENDS_ALREADY');
    if (requestSnap.exists()) throw new Error('REQUEST_OUTGOING');
    if (oppositeRequestSnap.exists()) throw new Error('REQUEST_INCOMING');
    if (!publicProfileSnap.exists()) throw new Error('FRIEND_PROFILE_UNAVAILABLE');

    const profile = publicProfileSnap.data();
    transaction.set(requestRef, {
      fromUid: currentUid,
      toUid: targetUid,
      fromDisplayName: String(profile.displayName || 'ScreenShelf user').slice(0, 60),
      fromPhotoURL: normalizeProfilePhoto(profile.photoURL),
      createdAt: serverTimestamp(),
    });
  });
}

async function submitFriendCode(){

}

async function acceptFriendRequest(requestId){
  if (!cloudSyncUser) return;
  try {
    await runTransaction(firebaseDb, async transaction => {
      const requestRef = doc(firebaseDb, 'friendRequests', requestId);
      const requestSnap = await transaction.get(requestRef);
      if (!requestSnap.exists()) throw new Error('REQUEST_NOT_FOUND');
      const request = requestSnap.data();
      const fromUid = String(request.fromUid || '');
      const toUid = String(request.toUid || '');
      if (toUid !== cloudSyncUser.uid) throw new Error('REQUEST_NOT_FOR_YOU');
      if (!fromUid || requestId !== friendRequestId(fromUid, toUid)) throw new Error('REQUEST_NOT_FOUND');

      const users = [fromUid, toUid].sort();
      const friendshipRef = doc(firebaseDb, 'friendships', friendshipId(fromUid, toUid));
      const friendshipSnap = await transaction.get(friendshipRef);
      if (friendshipSnap.exists()) throw new Error('FRIENDS_ALREADY');

      transaction.set(friendshipRef, { users, createdAt: serverTimestamp() });
      transaction.delete(requestRef);
    });
    showToast('Friend request accepted.');
  } catch(error) {
    showToast(friendErrorMessage(error));
  }
  await loadFriendsData();
}

async function rejectFriendRequest(requestId){
  try {

/* =========================================================
   TMDB API
========================================================= */
function hasApiKey(){ return !!(state.settings.apiKey && state.settings.apiKey.trim()); }

async function tmdbFetch(path, params){
  if (!hasApiKey()) { const e = new Error('No TMDB API key configured.'); e.code='NO_KEY'; throw e; }
  const url = new URL(TMDB_BASE + path);
  url.searchParams.set('api_key', state.settings.apiKey.trim());
  Object.entries(params || {}).forEach(([k,v]) => url.searchParams.set(k, v));
  let res;
  try { res = await fetch(url.toString()); }
  catch(err){ const e = new Error('Network error reaching TMDB.'); e.code='NETWORK'; throw e; }
  if (!res.ok) {
    let msg = 'TMDB request failed (' + res.status + ').';
    if (res.status === 401) msg = 'TMDB rejected the API key.';
    const e = new Error(msg); e.code = 'HTTP_' + res.status; throw e;
  }
  return res.json();
}
function searchTv(query){ return tmdbFetch('/search/tv', { query, include_adult:'false' }); }
function getTvDetails(tmdbId){ return tmdbFetch('/tv/' + tmdbId, {}); }
function testConnection(){ return tmdbFetch('/configuration', {}); }

function episodeRuntimeFromTv(tv){
  const arr = Array.isArray(tv.episode_run_time) ? tv.episode_run_time.filter(n => typeof n === 'number' && n > 0) : [];
  if (!arr.length) return null;
  return Math.round(arr.reduce((a,b) => a+b, 0) / arr.length);
}

function tmdbSeriesToAnimeShape(tv){
  const seasons = (tv.seasons || [])
    .filter(s => s.season_number !== 0)
    .sort((a,b)=> a.season_number - b.season_number)
    .map(s => ({
      tmdbSeasonId: s.id,
      seasonNumber: s.season_number,
      name: s.name || ('Season ' + s.season_number),
      episodeCount: s.episode_count || 0,
      watched: false,
    }));
  return {
    tmdbId: tv.id,
    title: tv.name,
    poster: tv.poster_path || null,
    backdrop: tv.backdrop_path || null,
    seasons,
    tmdbMeta: {
      numberOfSeasons: tv.number_of_seasons || seasons.length,
      numberOfEpisodes: tv.number_of_episodes || 0,
      tmdbStatus: tv.status || '',
      episodeRuntime: episodeRuntimeFromTv(tv),
      tmdbVoteAverage: boundedDecimal(tv.vote_average, 0, 10, null),
      tmdbVoteCount: boundedInteger(tv.vote_count, 0, 2147483647, null),
    },
  };
}

/* =========================================================
   Images — direct TMDB URLs, cached offline by the service
   worker's runtime cache (see service-worker.js) instead of
   a hand-rolled IndexedDB copy.
========================================================= */
function posterSrc(path){
  const safePath = normalizeTmdbImagePath(path);
  return safePath ? (IMG_BASE + POSTER_SIZE + safePath) : PLACEHOLDER_SVG;
}

function escapeHtml(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

const EMPTY_STATUS_MESSAGES = {
  watching: 'Nothing? I know you are studying😏',
  planned: 'You have nothing planned😳? What are you doing?',
  comeback: 'There are no returning shows🥱',
  returning: 'There are no returning shows🥱',
  finished: 'What? You haven\'t finished anything? Seriously?🫪',
  dropped: 'Oh, nothing dropped. You picked good shows then🙂',
};
const SORT_OPTIONS = [
  { key:'az', label:'A–Z' },
  { key:'added', label:'Recently Added' },
  { key:'updated', label:'Recently Updated' },
];
function itemRuntimeMinutes(a){
  const meta=a.tmdbMeta&&typeof a.tmdbMeta.episodeRuntime==='number'&&a.tmdbMeta.episodeRuntime>0?a.tmdbMeta.episodeRuntime:null;
  if(meta)return meta;
  return a.mediaType==='show'?SERIES_FALLBACK_RUNTIME_MIN:ANIME_FALLBACK_RUNTIME_MIN;
}
function watchedMinutesForItem(a){
  const perEp=itemRuntimeMinutes(a);
  return (a.seasons||[]).reduce((sum,s)=> sum + (s.watched?(s.episodeCount||0)*perEp:0), 0);
}
function watchedMinutesForLibrary(items){
  return items.reduce((sum,a)=> sum + watchedMinutesForItem(a), 0);
}
function pluralUnit(n, unit){ return n+' '+unit+(n===1?'':'s'); }
function formatWatchedTime(totalMinutes){
  const h=Math.floor(totalMinutes/60), m=totalMinutes%60;
  return pluralUnit(h,'hour')+' '+pluralUnit(m,'minute');
}
function activeSortKey(){ return state.activeTab==='anime' ? state.sortBy.anime : state.sortBy.shows; }
function sortItems(items){
  const mode = activeSortKey();
  const sorted = items.slice();
  if (mode === 'added') sorted.sort((x,y)=> (y.addedAt||0) - (x.addedAt||0));
  else if (mode === 'updated') sorted.sort((x,y)=> (y.updatedAt||0) - (x.updatedAt||0));
  else sorted.sort((x,y)=> x.title.localeCompare(y.title));
  return sorted;
}

  const sortRow = `<div class="sort-row"><span>Sort:</span>
    <select id="sort-select" aria-label="Sort library">${SORT_OPTIONS.map(o=>`<option value="${o.key}" ${activeSortKey()===o.key?'selected':''}>${o.label}</option>`).join('')}</select>
    <div class="library-view-toggle" role="group" aria-label="Library view">

    </div>
  </div>`;
  const sections=statuses.map(st=>{
    const items=sortItems(lib.filter(a=>a.status===st.key));
    const open=state.expandedStatus===st.key;
    const rows=items.length ? (state.libraryView === 'grid'
      ? `<div class="library-grid">${items.map(a=>{
        const rating = a.rating && RATING_MAP[a.rating] ? RATING_MAP[a.rating] : null;
        return `<button class="library-grid-tile" data-open-detail="${escapeHtml(a.id)}">
          <img class="library-grid-poster" src="${posterSrc(a.poster)}" alt="">${rating ? `<span class="library-grid-rating" aria-label="${escapeHtml(rating.label)}" title="${escapeHtml(rating.label)}">${rating.emoji}</span>` : ''}<span class="library-grid-title">${escapeHtml(a.title)}</span>
        </button>`;
      }).join('')}</div>`
      : items.map(a=>{
        const rating = a.rating && RATING_MAP[a.rating] ? RATING_MAP[a.rating] : null;
        return `<button class="anime-row own-library-row" data-open-detail="${escapeHtml(a.id)}">
          <img class="poster-thumb" src="${posterSrc(a.poster)}" alt=""><span class="anime-title-wrap"><span class="anime-title">${escapeHtml(a.title)}</span></span>${state.settings.showLibraryRatings ? `<span class="library-rating" title="${rating ? escapeHtml(rating.label) : 'Not rated'}" aria-label="${rating ? escapeHtml(rating.label) : 'Not rated'}">${rating ? rating.emoji : ''}</span>` : ''}</button>`;
      }).join(''))
      : `<div class="status-empty">${escapeHtml(EMPTY_STATUS_MESSAGES[st.key] || 'Nothing here yet.')}</div>`;
    return `<div class="status-section status-${st.key}"><button class="status-header" aria-expanded="${open}" data-toggle-status="${st.key}">

  }).join('');
  const watchedTime=`<div class="watched-time-stat">
    <div class="watched-time-main"><span class="watched-time-label">Watched time</span> · <span class="watched-time-value">approx. ${formatWatchedTime(watchedMinutesForLibrary(lib))}</span></div>
    <div class="watched-time-sub">(if watched in 1×, intro &amp; outro included 😛)</div>
  </div>`;
  return tabs+sortRow+sections+watchedTime;
}

function renderSearchResultsBody(){

  }
  if (!state.searchQuery.trim()){

  }
  if (state.searchResults.length === 0){
    return `<div class="search-hint">No results for “${escapeHtml(state.searchQuery)}”.</div>`;
  }
  const cards = state.searchResults.map(r => {
    const owned = activeLibrary().find(a => a.tmdbId === r.id);

function formatVoteCount(count){
  if (count >= 1000000) return (count / 1000000).toFixed(count >= 10000000 ? 0 : 1).replace(/\.0$/, '') + 'M';
  if (count >= 1000) return (count / 1000).toFixed(count >= 10000 ? 0 : 1).replace(/\.0$/, '') + 'K';
  return String(count);
}
function tmdbScoreMarkup(meta){
  const score = boundedDecimal(meta && meta.tmdbVoteAverage, 0, 10, null);
  const votes = boundedInteger(meta && meta.tmdbVoteCount, 0, 2147483647, null);
  if (score == null || !votes) return '';
  const scoreText = score.toFixed(1) + '/10';
  const voteText = formatVoteCount(votes) + ' votes';
  return `<div class="tmdb-score" aria-label="TMDB community score ${scoreText}, ${voteText}" title="TMDB community score"><span class="tmdb-score-mark" aria-hidden="true">TMDB</span><span class="tmdb-score-value">${scoreText}</span><span aria-hidden="true">•</span><span>${voteText}</span></div>`;
}
function renderDetail(){
  if(state.detailLoading)return `<div class="view-head"><button class="back-btn" data-go="${state.previewMode?'search':'home'}">← Back</button></div><div class="loading-block"><div class="spinner">🌀</div><div>Loading from TMDB…</div></div>`;
  const lib=activeLibrary(),map=activeStatusMap(),a=state.previewMode?state.previewTmdb:lib.find(x=>x.id===state.detailId);
  if(!a)return `<div class="view-head"><button class="back-btn" data-go="home">← Back</button></div><div class="empty-block"><div class="empty-title">Not found</div></div>`;
  const seasons=a.seasons||[],totalEpisodes=seasons.reduce((n,x)=>n+(x.episodeCount||0),0);
  const seasonRows=seasons.map((x,i)=>renderSeasonRow(x,i)).join('')||`<div class="status-empty">No season data from TMDB.</div>`;

  const mode = friendLibrarySortKey();
  const sorted = items.slice();
  if (mode === 'added') sorted.sort((x, y) => (y.addedAt || 0) - (x.addedAt || 0));
  else if (mode === 'updated') sorted.sort((x, y) => (y.updatedAt || 0) - (x.updatedAt || 0));
  else sorted.sort((x, y) => x.title.localeCompare(y.title));
  return sorted;
}

function updateBellBadge(){

function timeAgo(ts){
  const diff = Date.now() - ts;
  const mins = Math.round(diff/60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return mins + 'm ago';
  const hrs = Math.round(mins/60);
  if (hrs < 24) return hrs + 'h ago';
  const days = Math.round(hrs/24);
  return days + 'd ago';
}
function openNotifications(){

    : `<div class="notif-empty">No notifications yet. You'll hear about new seasons and episodes added to anime in your library.</div>`;

  openSheet(`

}

/* =========================================================
   Actions
========================================================= */
async function goHome(){ state.view='home'; state.previewMode=false; render(); }
function goSettings(){ state.view='settings'; render(); }
function resetSearchState(){
  clearTimeout(searchDebounce);
  searchRequestVersion += 1;
  state.searchQuery = '';
  state.searchResults = [];
  state.searchLoading = false;
  state.searchError = '';
}
function goSearch({ fresh = true } = {}){
  if (fresh) resetSearchState();
  state.view='search';
  render();
  setTimeout(()=>{ const input=document.getElementById('search-input'); if(input){ input.focus(); input.setSelectionRange(input.value.length, input.value.length); } },0);
}

let searchDebounce = null;
let searchRequestVersion = 0;
async function runSearch(q){
  const requestVersion = ++searchRequestVersion;
  state.searchQuery=q;
  if(!q.trim()){state.searchResults=[];state.searchError='';updateSearchResults();return;}
  state.searchLoading=true;updateSearchResults();
  try{
    const data=await searchTv(q.trim());
    if (requestVersion !== searchRequestVersion) return;
    state.searchResults=(data.results||[]).map(r=>{
      const id = normalizeTmdbId(r.id);
      const name = normalizeText(r.name, MAX_LIBRARY_TITLE_LENGTH);
      const isAnimation = Array.isArray(r.genre_ids) && r.genre_ids.includes(16);
      if (!id || !name || (state.activeTab==='anime' ? !isAnimation : isAnimation)) return null;
      return { id, name, poster_path: normalizeTmdbImagePath(r.poster_path) };
    }).filter(Boolean);
    state.searchError='';
  }catch(err){
    if (requestVersion !== searchRequestVersion) return;
    state.searchError=err.message||'Something went wrong.';state.searchResults=[];
  }
  if (requestVersion !== searchRequestVersion) return;
  state.searchLoading=false;updateSearchResults();
}

async function hydrateDetailTmdbScore(localId, mediaType){
  if (!hasApiKey()) return;
  const library = mediaType === 'show' ? state.showLibrary : state.library;
  const initial = library.find(item => item.id === localId);
  if (!initial || (initial.tmdbMeta && initial.tmdbMeta.tmdbVoteAverage != null && initial.tmdbMeta.tmdbVoteCount != null)) return;
  try {
    const tv = await getTvDetails(initial.tmdbId);
    const score = boundedDecimal(tv.vote_average, 0, 10, null);
    const votes = boundedInteger(tv.vote_count, 0, 2147483647, null);
    const current = library.find(item => item.id === localId);
    if (!current || current.tmdbId !== initial.tmdbId) return;
    if (current.tmdbMeta.tmdbVoteAverage === score && current.tmdbMeta.tmdbVoteCount === votes) return;
    current.tmdbMeta = { ...current.tmdbMeta, tmdbVoteAverage:score, tmdbVoteCount:votes };
    await saveActiveItemForType(current, mediaType);
    if (state.view === 'detail' && !state.previewMode && state.detailId === localId) render();
  } catch(error) {
    // Missing score data must never prevent an existing library title opening.
    console.warn('Could not load TMDB score for', initial.title, error);
  }
}

/* Resize/compress an image file client-side into a small square JPEG data URL.
   No Firebase Storage involved — the result is small enough to store as a
   plain field on the Firestore profile doc, which already syncs across devices. */
function fileToCompressedDataUrl(file, size = 160, quality = 0.7){
  return new Promise((resolve, reject) => {
    const img = new Image();
    const objectUrl = URL.createObjectURL(file);
    img.onload = () => {
      try {
        const side = Math.min(img.width, img.height);
        const sx = (img.width - side) / 2;
        const sy = (img.height - side) / 2;
        const canvas = document.createElement('canvas');
        canvas.width = size; canvas.height = size;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, sx, sy, side, side, 0, 0, size, size);
        resolve(canvas.toDataURL('image/jpeg', quality));
      } catch(err){ reject(err); }
      finally { URL.revokeObjectURL(objectUrl); }
    };
    img.onerror = () => { URL.revokeObjectURL(objectUrl); reject(new Error('Could not read image.')); };
    img.src = objectUrl;
  });
}

   Import / Export
========================================================= */
function exportLibrary(){
  const serializeItem = (a) => ({
    tmdbId: a.tmdbId,
    title: a.title,
    poster: a.poster || null,
    backdrop: a.backdrop || null,
    status: a.status,
    rating: (typeof a.rating === 'string' && RATING_MAP[a.rating]) ? a.rating : null,
    addedAt: a.addedAt || null,
    mediaType: a.mediaType || null,
    seasons: (a.seasons || []).map(s => ({
      tmdbSeasonId: s.tmdbSeasonId,
      seasonNumber: s.seasonNumber,
      name: s.name,
      episodeCount: s.episodeCount,
      watched: !!s.watched,
    })),
    tmdbMeta: a.tmdbMeta || null,
  });

  const payload = {
    app: 'screenshelf',
    version: 2,
    exportedAt: new Date().toISOString(),
    libraries: {
      anime: state.library.map(serializeItem),
      series: state.showLibrary.map(serializeItem),
    },
  };

  const blob = new Blob([JSON.stringify(payload, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = 'screenshelf-backup-' + new Date().toISOString().slice(0,10) + '.json';
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  showToast('Backup downloaded.');
}

async function importLibrary(file){
  let data;
  try {
    data = JSON.parse(await file.text());
  } catch(e) {
    showToast('That file is not valid JSON.');
    return;
  }

  // Supports the new combined backup and the previous anime-only backup.
  const animeIncoming = Array.isArray(data?.libraries?.anime)
    ? data.libraries.anime
    : Array.isArray(data?.library)
      ? data.library
      : Array.isArray(data)
        ? data
        : [];

  const seriesIncoming = Array.isArray(data?.libraries?.series)
    ? data.libraries.series
    : [];

  if (!animeIncoming.length && !seriesIncoming.length) {
    showToast("That file doesn't look like a ScreenShelf backup.");
    return;
  }

  let animeAdded = 0, seriesAdded = 0, skipped = 0;

  const restore = async (item, mediaType) => {
    const restored = normalizeLibraryItem(item, mediaType);
    if (!restored) {
      skipped++;
      return;
    }

    const target = mediaType === 'show' ? state.showLibrary : state.library;
    if (target.some(a => a.tmdbId === restored.tmdbId)) {
      skipped++;
      return;
    }

    target.push(restored);
    await saveActiveItemForType(restored, mediaType);

    if (mediaType === 'show') seriesAdded++;
    else animeAdded++;
  };

  for (const item of animeIncoming) await restore(item, 'anime');
  for (const item of seriesIncoming) await restore(item, 'show');

  showToast(
    `Imported ${animeAdded} anime + ${seriesAdded} series` +
    (skipped ? `, skipped ${skipped} (already had / invalid)` : '') + '.'
  );
  render();
}

/* =========================================================
   Refresh / "Coming back?" update check
========================================================= */
async function refreshComebacks(){
  if(!hasApiKey()||state.refreshing)return;
  state.refreshing=true;
  try{
    for(const a of [...state.library,...state.showLibrary]){
      try{
        // Do not process an item whose deletion is currently in flight.
        if(deletingLibraryIds.has(a.id)) continue;

        const tv=await getTvDetails(a.tmdbId);

        // The item may have been deleted while the TMDB request was pending.
        const currentLibrary = a.mediaType === 'show' ? state.showLibrary : state.library;
        const currentItem = currentLibrary.find(x=>x.id===a.id);
        if(!currentItem || deletingLibraryIds.has(a.id)) continue;

        const prev=currentItem.tmdbMeta||{numberOfSeasons:0,numberOfEpisodes:0,tmdbStatus:'',tmdbVoteAverage:null,tmdbVoteCount:null};
        const ns=tv.number_of_seasons||0,ne=tv.number_of_episodes||0,st=tv.status||'';
        const voteAverage = boundedDecimal(tv.vote_average, 0, 10, null);
        const voteCount = boundedInteger(tv.vote_count, 0, 2147483647, null);
        const newContent=ns>prev.numberOfSeasons||ne>prev.numberOfEpisodes;
        const returned=prev.tmdbStatus&&/ended|canceled|cancelled/i.test(prev.tmdbStatus)&&st&&/returning/i.test(st);

        if(newContent||returned){
          const note={id:uid(),animeId:currentItem.id,mediaType:currentItem.mediaType||'anime',title:returned ? currentItem.title + ' is returning!' : currentItem.title + ' — ' + (
            (ns - prev.numberOfSeasons) > 0
              ? `New season (${ns} total)`
              : `${ne - prev.numberOfEpisodes} new episode${(ne - prev.numberOfEpisodes) === 1 ? '' : 's'}`
          ),createdAt:Date.now(),read:false};
          state.notifications.unshift(note);
          await saveNotification(note);

          // Notification saving is asynchronous, so check again before
          // changing/saving the library item.
          const liveLibrary = currentItem.mediaType === 'show' ? state.showLibrary : state.library;
          if(!liveLibrary.some(x=>x.id===currentItem.id) || deletingLibraryIds.has(currentItem.id)) continue;

          const fresh=tmdbSeriesToAnimeShape(tv),watched=new Map((currentItem.seasons||[]).map(x=>[x.seasonNumber,!!x.watched]));
          currentItem.seasons=fresh.seasons.map(x=>Object.assign(x,{watched:watched.get(x.seasonNumber)||false}));
        }

        const metaChanged = ns!==prev.numberOfSeasons || ne!==prev.numberOfEpisodes || st!==prev.tmdbStatus
          || voteAverage !== prev.tmdbVoteAverage || voteCount !== prev.tmdbVoteCount;
        if(metaChanged){
          // No await occurs between this final guard and the Firestore write.
          // If deletion starts later, its deleteDoc is queued after this write.
          const liveLibrary = currentItem.mediaType === 'show' ? state.showLibrary : state.library;
          const stillExists=liveLibrary.some(x=>x.id===currentItem.id);
          if(!stillExists || deletingLibraryIds.has(currentItem.id)) continue;

          currentItem.tmdbMeta={numberOfSeasons:ns,numberOfEpisodes:ne,tmdbStatus:st,episodeRuntime:episodeRuntimeFromTv(tv),tmdbVoteAverage:voteAverage,tmdbVoteCount:voteCount};
          await saveActiveItemForType(currentItem,currentItem.mediaType==='show'?'show':'anime');
        }
      }catch(e){ console.warn('refreshComebacks failed for', a.title, e); }
    }
  }finally{
    state.refreshing=false;
    render();
  }
}

/* =========================================================
   Pull to refresh (touch)
========================================================= */
function setupPullToRefresh(){
  const main = document.getElementById('main');
  let startY = null, pulling = false;
  main.addEventListener('touchstart', (e) => {
    if (state.view !== 'home' || window.scrollY > 4) { startY = null; return; }
    startY = e.touches[0].clientY;
  }, { passive:true });
  main.addEventListener('touchmove', (e) => {
    if (startY == null) return;
    const dy = e.touches[0].clientY - startY;
    if (dy > 60 && !pulling){ pulling = true; }
  }, { passive:true });
  main.addEventListener('touchend', async () => {
    if (pulling){
      pulling = false; startY = null;
      showToast('Checking for updates…');
      await refreshComebacks();
      showToast('Up to date.');
    }
    startY = null;
  });
}

  if (cancelRequest) return cancelFriendRequest(cancelRequest.getAttribute('data-cancel-friend-request'));
  const openFriend = e.target.closest('[data-open-friend-library]');
  if (openFriend) return openFriendLibrary(openFriend.getAttribute('data-open-friend-library'));
  const remove = e.target.closest('[data-remove-friend]');
  if (remove) return removeFriend(remove.getAttribute('data-remove-friend'));

  const setStatus = e.target.closest('[data-set-status]');
  if (setStatus) return setAnimeStatus(setStatus.getAttribute('data-set-status'));
  const setRating = e.target.closest('[data-set-rating]');
  if (setRating) return setAnimeRating(setRating.getAttribute('data-set-rating'));
  const addWith = e.target.closest('[data-add-with-status]');
  if (addWith) return confirmAddWithStatus(addWith.getAttribute('data-add-with-status'));

  const deleteNotification = e.target.closest('[data-delete-notification]');
  if (deleteNotification) return deleteNotificationById(deleteNotification.getAttribute('data-delete-notification'));

  if (e.target.id === 'cancel-delete') return closeSheet();
  if (e.target.id === 'confirm-delete') return deleteCurrentAnime();
});

function isFriendLibraryView(){ return state.view === 'friendLibrary' || state.view === 'friendDetail'; }
document.getElementById('btn-search').addEventListener('click', () => { if (!isFriendLibraryView()) goSearch(); });
document.getElementById('btn-settings').addEventListener('click', () => { if (!isFriendLibraryView()) goSettings(); });
document.getElementById('btn-bell').addEventListener('click', () => { if (!isFriendLibraryView()) openNotifications(); });

  applyTheme();
  render();
  setupPullToRefresh();
  // Library/settings/notifications populate once Firestore sync starts
  // after login (see startCloudSync), which also triggers the initial
  // refreshComebacks() run once a TMDB key is available.
})();

})();
